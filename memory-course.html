<!DOCTYPE html>
<html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>Learn Faster, Remember Longer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--pr:#0d9488;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ef;--code:#eef0f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.xp{background:var(--pr);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.day{font-size:12px;font-weight:700;color:var(--pr);text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{width:34px;height:34px;border-radius:50%;background:var(--code);display:grid;place-items:center;font-weight:700;flex:none}
.done .dot{background:var(--ok);color:#fff}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--code);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%;margin-top:10px}
button.g{background:var(--code);color:var(--tx)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);margin-top:8px;font-weight:500}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.opt.no{border-color:var(--bad);background:rgba(220,38,38,.12)}
pre,code{background:var(--code);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
code{padding:1px 5px}pre{padding:10px;overflow-x:auto;margin:8px 0}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:var(--code);font-size:15px}
.fc{min-height:130px;display:grid;place-items:center;text-align:center;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}td{border-bottom:1px solid var(--bd);padding:6px 4px;vertical-align:top}
.back{background:none;color:var(--mu);width:auto;padding:4px 0;margin:0}
</style></head><body><div id="app"></div>
<script>
const TITLE="Learn Faster, Remember Longer",SUB="Memory science applied to SQL, APIs, and Python. Take one lesson at a time and use the techniques on the cards as you go.",KEY="memC";
const L=[
{d:"Part 1 · How memory works",t:"Why we forget",s:[
["Three steps","Every memory goes through <b>encoding</b> (taking it in), <b>consolidation</b> (stabilizing it, largely during sleep), and <b>retrieval</b> (pulling it back out). Weakness at any step looks like \"I forget everything.\""],
["The forgetting curve","Without review, a large share of new material fades within days. Each time you successfully retrieve something, the curve flattens and it lasts longer. The goal isn't to avoid forgetting; it's to schedule the retrieval."],
["The fluency illusion","Rereading notes or rewatching a tutorial feels productive because it's familiar. But recognizing is not recalling. The test: can you write the query or call from a blank screen?"]],
q:[{q:"Which step happens largely during sleep?",o:["Encoding","Consolidation","Retrieval","Recognition"],a:1,e:"Sleep helps stabilize new memories."},
{q:"Rereading a tutorial feels easy mainly because of…",o:["Deep understanding","The fluency illusion","Spaced repetition","Chunking"],a:1,e:"Familiarity feels like knowing but isn't recall."},
{q:"What flattens the forgetting curve?",o:["Successful retrieval over time","Highlighting","Longer sessions only","Silence"],a:0,e:"Each successful recall makes the memory more durable."}]},
{d:"Part 1 · How memory works",t:"Active recall",s:[
["Test yourself","<b>Active recall</b> means pulling answers out of your head before checking. Research on the testing effect shows that being quizzed beats restudying, even when you get answers wrong."],
["Try it with code","Instead of rereading a JOIN lesson, close it and write:<pre>-- all customers with their orders,\n-- including customers with no orders</pre>Then check. Struggling a bit is the point, which researchers call a <i>desirable difficulty</i>."],
["Your daily 'blank page' drill","Each session, start with 5 minutes: write yesterday's concept from scratch with no notes. Fix it afterward in a different color so you can see the gap."]],
q:[{q:"Best way to study a SQL JOIN you just read about?",o:["Reread it twice","Close the lesson and write a JOIN from scratch","Highlight it","Watch another video"],a:1,e:"Produce, then check."},
{q:"A desirable difficulty is…",o:["Studying while distracted","Effortful retrieval that strengthens memory","A hard exam","Skipping practice"],a:1,e:"Effort during retrieval builds durability."},
{q:"If you get a recall attempt wrong, you should…",o:["Skip it","Check the answer; the attempt still helps","Quit for the day","Only read the answer"],a:1,e:"Even failed attempts boost later learning once you see the answer."}]},
{d:"Part 2 · Techniques",t:"Spaced repetition",s:[
["Space it out","Reviewing a concept at growing gaps beats cramming. A simple schedule:<table><tr><td>Day 0</td><td>Learn it</td></tr><tr><td>Day 1</td><td>Review</td></tr><tr><td>Day 3</td><td>Review</td></tr><tr><td>Day 7</td><td>Review</td></tr><tr><td>Day 14, 30</td><td>Review</td></tr></table>If you miss a card, it goes back to a short interval."],
["Make cards that work","One fact per card, ask a question, make the answer short. Good: <i>\"What does a LEFT JOIN keep?\"</i> Bad: \"Explain all joins.\" For code, a card can be a mini task: <i>\"Write a query for the top 3 by sales.\"</i>"],
["Sleep matters","Sleep is when consolidation happens. A short review before bed and a recall attempt in the morning is a very effective pair."]],
q:[{q:"Why is spacing better than cramming?",o:["It's faster","Retrieval after some forgetting strengthens memory more","It uses less time per card","It avoids sleep"],a:1,e:"Slight forgetting makes recall more effortful, and that effort builds retention."},
{q:"Best flashcard?",o:["Everything about joins","One question with one short answer","A full page of notes","A video link"],a:1,e:"Small, specific cards."},
{q:"You missed a card. Next review?",o:["Next month","Soon, with a short interval","Never","Same as correct ones"],a:1,e:"Missed items reset to a short gap."}]},
{d:"Part 2 · Techniques",t:"Chunking & understanding",s:[
["Chunking","Working memory holds only a few items at once. <b>Chunking</b> groups details into one unit. A beginner sees <code>SELECT, FROM, WHERE, GROUP BY, ORDER BY</code> as five separate things; an expert sees one pattern: <i>choose, from where, filter, group, sort</i>."],
["Elaboration and analogy","Connect new ideas to what you already know. An API is a waiter. A JOIN is matching rows like a VLOOKUP. A Python dict is a JSON object. The more links, the more ways to retrieve it."],
["The Feynman test","Explain the concept out loud as if to a new coworker, in plain words. Wherever you stumble or use jargon, you've found the gap. Go back, fix it, explain again."]],
q:[{q:"Chunking means…",o:["Memorizing faster","Grouping details into a single meaningful unit","Skipping details","Taking breaks"],a:1,e:"Groups reduce load on working memory."},
{q:"'A Python dict is like JSON' is an example of…",o:["Cramming","Analogy / elaboration","Rote repetition","Interference"],a:1,e:"Linking new to known ideas."},
{q:"Where you stumble while explaining is…",o:["Proof you're bad at it","A gap to fix","Irrelevant","A sign to stop"],a:1,e:"Stumbles pinpoint what to study."}]},
{d:"Part 3 · Applying it to tech",t:"Learning code that sticks",s:[
["Type it, don't paste it","Typing code yourself forces retrieval and attention. Copy-pasting skips both. Also <b>predict the output</b> before running anything. Being wrong is useful."],
["Interleave","Mix topics in a session (a SQL query, then a Python loop, then an API call) rather than 90 minutes of one thing. It feels harder, but it improves your ability to choose the right tool."],
["Error journal","Keep a running list: <i>error → cause → fix</i>. Example: <code>401</code> → missing key → add the Authorization header. Reviewing your own mistakes is the best card deck you'll ever have."],
["Build small, then bigger","Use each new concept in a tiny project within 24 hours: clean a CSV, call a public API, write a query on your own data. Use beats passive study."]],
q:[{q:"Before running code you wrote, you should…",o:["Just run it","Predict what it will do","Copy from tutorial","Delete it"],a:1,e:"Prediction creates a useful error signal."},
{q:"Interleaving means…",o:["Studying one topic for hours","Mixing related topics in one session","Never reviewing","Studying at night only"],a:1,e:"Mixing builds discrimination between concepts."},
{q:"An error journal entry is…",o:["error → cause → fix","date → mood","tool → price","name → email"],a:0,e:"It becomes a personal review deck."}]},
{d:"Part 3 · Applying it to tech",t:"Tech flashcards",fc:[
["SQL: order of a query as written","SELECT, FROM, JOIN, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT."],
["SQL: WHERE vs HAVING","WHERE filters rows before grouping; HAVING filters groups after aggregation."],
["SQL: INNER vs LEFT JOIN","INNER keeps only matches. LEFT keeps every left-table row, with NULLs where there's no match."],
["SQL: how do you find duplicates?","GROUP BY the column, HAVING COUNT(*) > 1."],
["API: 401 vs 403","401: not authenticated. 403: authenticated but not allowed."],
["API: GET vs POST","GET reads data; POST sends a body to create something."],
["Python: list vs dict","List: ordered items by position. Dict: key → value pairs, like JSON objects."],
["Python: list comprehension","[x*2 for x in nums if x > 0] builds a new list in one line."],
["Python: what does a for loop do?","Runs a block once for each item in a sequence."],
["Learning: the 4-step daily loop","1) Blank-page recall of yesterday. 2) Learn one new thing by typing it. 3) Use it in something small. 4) Add 3 cards and one error-journal line."]]}
];
let S={xp:0,done:{}};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
function home(){let h=`<div class=top><h1>${TITLE}</h1><span class=xp>⚡ ${S.xp} XP</span></div><div class=mu>${SUB}</div>`;
const n=Object.keys(S.done).length;h+=`<div class=bar><i style="width:${n/L.length*100}%"></i></div><div class=mu>${n} of ${L.length} lessons complete</div>`;
let last="";L.forEach((l,i)=>{if(l.d!=last){h+=`<div class=day>${l.d}</div>`;last=l.d}
h+=`<div class="card les ${S.done[i]!=null?"done":""}" onclick="start(${i})"><div class=dot>${S.done[i]!=null?"✓":i+1}</div><div><b>${l.t}</b><div class=mu>${l.fc?l.fc.length+" flashcards":l.s.length+" cards · "+l.q.length+" questions"}${S.done[i]!=null?" · best "+S.done[i]+"%":""}</div></div></div>`});
h+=`<button class=g onclick="if(confirm('Reset progress?')){S={xp:0,done:{}};save();home()}">Reset progress</button>`;$.innerHTML=h}
let cur,step,score,ans;
function start(i){cur=i;step=0;score=0;ans=false;card()}
function card(){const l=L[cur];if(l.fc)return fc(0);
if(step<l.s.length){const c=l.s[step];$.innerHTML=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${step/(l.s.length+l.q.length)*100}%"></i></div><div class=card><h2>${c[0]}</h2>${c[1]}</div><button onclick="step++;card()">Continue</button>`;return}
const qi=step-l.s.length;if(qi>=l.q.length)return fin();
const q=l.q[qi];ans=false;
$.innerHTML=`<button class=back onclick="home()">← Quit</button><div class=bar><i style="width:${step/(l.s.length+l.q.length)*100}%"></i></div><div class=card><div class=mu>Question ${qi+1} of ${l.q.length}</div><h2>${q.q}</h2>${q.o.map((o,k)=>`<button class=opt onclick="pick(${k},this)">${o}</button>`).join("")}<div id=fb></div></div>`}
function pick(k,el){if(ans)return;ans=true;const q=L[cur].q[step-L[cur].s.length];
const ok=k==q.a;if(ok){score++;S.xp+=10}el.classList.add(ok?"ok":"no");
if(!ok)document.querySelectorAll(".opt")[q.a].classList.add("ok");
document.getElementById("fb").innerHTML=`<div class=fb>${ok?"✅ Correct! +10 XP":"❌ Not quite."} ${q.e}</div><button onclick="step++;card()">Next</button>`;save()}
function fin(){const l=L[cur],p=Math.round(score/l.q.length*100);S.done[cur]=Math.max(S.done[cur]||0,p);S.xp+=20;save();
$.innerHTML=`<div class=card style="text-align:center"><h1>${p==100?"🏆":"🎉"} Lesson complete</h1><p>You scored ${score}/${l.q.length} (${p}%). +20 XP bonus.</p>${p<100?`<p class=mu>Retake it to lock it in.</p>`:""}</div><button onclick="start(${cur})" class=g>Retry</button><button onclick="home()">Back to course</button>`}
function fc(i,flip){const l=L[cur],c=l.fc[i];if(i>=l.fc.length){S.done[cur]=100;S.xp+=30;save();return $.innerHTML=`<div class=card style="text-align:center"><h1>🏆 Course finished</h1><p>Come back to these flashcards in 1, 3, and 7 days. That's spaced repetition in action.</p></div><button onclick="home()">Back to course</button>`}
$.innerHTML=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${i/l.fc.length*100}%"></i></div><div class="card fc" onclick="fc(${i},${!flip})">${flip?`<div>${c[1]}</div>`:`<h2>${c[0]}</h2>`}</div><div class=mu style="text-align:center">${flip?"Did you recall it first?":"Say or write your answer, then tap to reveal."} Card ${i+1}/${l.fc.length}</div><button onclick="fc(${i+1})">${flip?"Next card":"Skip"}</button>`}
home();
</script></body></html>
