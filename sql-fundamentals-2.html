<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.xp{background:var(--pr);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.day{font-size:12px;font-weight:700;color:var(--pr);text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{width:34px;height:34px;border-radius:50%;background:var(--code);display:grid;place-items:center;font-weight:700;flex:none}
.done .dot{background:var(--ok);color:#fff}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%;margin-top:10px}

.win{border:2px solid var(--ok)}.f{margin:12px 0;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.back{background:none;color:var(--mu);width:auto;padding:4px 0;margin:0}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:var(--code);font-size:15px}
.fb div{margin:4px 0}.pl{padding:8px;margin:6px 0;border-radius:10px;background:var(--code);font-size:15px}
.say{margin-top:8px;padding:10px;border-radius:10px;background:rgba(22,163,74,.14);border:1px solid var(--ok);font-size:15px}

const M=[
{g:"Level up",t:"Recap: layer 1 in 60 seconds",ty:"mc",br:`Layer 1 gave you SELECT, WHERE, GROUP BY, HAVING, NULL and joins. This layer builds on them. Same <code>accounts</code> table, now with 2 more rows and a signup date:<div style="overflow-x:auto"><table><tr><th>id</th><th>name</th><th>region</th><th>status</th><th>mrr</th><th>signup</th></tr><tr><td>1</td><td>Birch Dental</td><td>East</td><td>active</td><td>400</td><td>2024-01-15</td></tr><tr><td>2</td><td>Cedar Clinic</td><td>West</td><td>active</td><td>650</td><td>2024-03-02</td></tr><tr><td>3</td><td>Dune Labs</td><td>East</td><td>paused</td><td>0</td><td>2024-03-20</td></tr><tr><td>4</td><td>Elm Care</td><td>West</td><td>active</td><td>NULL</td><td>2024-06-11</td></tr><tr><td>5</td><td>Fox Health</td><td>East</td><td>active</td><td>900</td><td>2025-01-09</td></tr><tr><td>6</td><td>Gale Vet</td><td>North</td><td>active</td><td>520</td><td>2025-02-18</td></tr><tr><td>7</td><td>Hill Optics </td><td>NULL</td><td>trial</td><td>0</td><td>2025-05-30</td></tr></table></div>Quick recall before the new material.`,Q:[{q:`Total mrr per region.`,o:[`SELECT region, SUM(mrr) FROM accounts;`,`SELECT region, SUM(mrr) FROM accounts GROUP BY region;`,`SELECT region, SUM(mrr) FROM accounts GROUP BY mrr;`,`SELECT region, SUM(mrr) FROM accounts GROUP region;`],a:1,e:`GROUP BY the non-aggregate column.`,r:`NULL | 0\nEast | 1300\nNorth | 520\nWest | 650`},
{q:`Regions with more than 2 accounts.`,o:[`SELECT region, COUNT(*) FROM accounts WHERE COUNT(*) &gt; 2 GROUP BY region;`,`SELECT region, COUNT(*) FROM accounts HAVING COUNT(*) &gt; 2;`,`SELECT region, COUNT(*) FROM accounts GROUP BY region HAVING COUNT(*) &gt; 2;`,`SELECT region FROM accounts WHERE region &gt; 2;`],a:2,e:`HAVING filters groups after aggregating.`,r:`East | 3`},
{q:`Accounts with no mrr recorded.`,o:[`SELECT name FROM accounts WHERE mrr IS NULL;`,`SELECT name FROM accounts WHERE mrr = NULL;`,`SELECT name FROM accounts WHERE mrr == NULL;`,`SELECT name FROM accounts WHERE mrr IS 'NULL';`],a:0,e:`Use IS NULL, never = NULL.`,r:`Elm Care`}],why:`Layer 1 is your base: WHERE for rows, HAVING for groups, IS NULL for gaps.`},
{g:"Level up",t:"Smarter filters",ty:"mc",br:`<code>IN</code> checks a list. <code>BETWEEN</code> checks a range, both ends included. <code>NOT</code> flips a condition. <code>LIKE</code> matches patterns: <code>%</code> is any run of characters, <code>_</code> is one character. Whether LIKE ignores upper/lower case depends on the database.<p><b>Worked example:</b> <code>SELECT name FROM accounts WHERE region IN ('East','North');</code> returns accounts in either region.<pre>Birch Dental
Dune Labs
Fox Health
Gale Vet</pre></p><div style="overflow-x:auto"><table><tr><th>id</th><th>name</th><th>region</th><th>status</th><th>mrr</th><th>signup</th></tr><tr><td>1</td><td>Birch Dental</td><td>East</td><td>active</td><td>400</td><td>2024-01-15</td></tr><tr><td>2</td><td>Cedar Clinic</td><td>West</td><td>active</td><td>650</td><td>2024-03-02</td></tr><tr><td>3</td><td>Dune Labs</td><td>East</td><td>paused</td><td>0</td><td>2024-03-20</td></tr><tr><td>4</td><td>Elm Care</td><td>West</td><td>active</td><td>NULL</td><td>2024-06-11</td></tr><tr><td>5</td><td>Fox Health</td><td>East</td><td>active</td><td>900</td><td>2025-01-09</td></tr><tr><td>6</td><td>Gale Vet</td><td>North</td><td>active</td><td>520</td><td>2025-02-18</td></tr><tr><td>7</td><td>Hill Optics </td><td>NULL</td><td>trial</td><td>0</td><td>2025-05-30</td></tr></table></div>`,Q:[{q:`Accounts with mrr from 400 to 650, ends included.`,o:[`SELECT name FROM accounts WHERE mrr BETWEEN 400, 650;`,`SELECT name FROM accounts WHERE mrr &gt; 400 AND mrr &lt; 650;`,`SELECT name FROM accounts WHERE mrr IN 400 TO 650;`,`SELECT name FROM accounts WHERE mrr BETWEEN 400 AND 650;`],a:3,e:`BETWEEN includes both ends. Using &gt; and &lt; drops them.`,r:`Birch Dental\nCedar Clinic\nGale Vet`},
{q:`Names containing 'Dental'.`,o:[`SELECT name FROM accounts WHERE name = '%Dental%';`,`SELECT name FROM accounts WHERE name LIKE 'Dental';`,`SELECT name FROM accounts WHERE name LIKE '%Dental%';`,`SELECT name FROM accounts WHERE name CONTAINS 'Dental';`],a:2,e:`LIKE needs the % wildcards to match inside text.`,r:`Birch Dental`}],why:`IN for lists, BETWEEN for inclusive ranges, LIKE with % for patterns.`},
{g:"Level up",t:"AND, OR and parentheses",ty:"mc",br:`SQL evaluates <code>AND</code> before <code>OR</code>. When you mix them, add parentheses to say what you mean.<p><b>Worked example:</b> <code>SELECT name FROM accounts WHERE status='active' AND (region='East' OR region='North');</code> active accounts in the East or North.<pre>Birch Dental
Fox Health
Gale Vet</pre></p>Without the parentheses, the OR part would escape the status check.`,Q:[{q:`Active accounts in the East or West.`,o:[`SELECT name FROM accounts WHERE status = 'active' AND (region = 'East' OR region = 'West');`,`SELECT name FROM accounts WHERE status = 'active' AND region = 'East' OR region = 'West';`,`SELECT name FROM accounts WHERE status = 'active' OR (region = 'East' AND region = 'West');`,`SELECT name FROM accounts WHERE status = 'active' AND region IN 'East', 'West';`],a:0,e:`Parentheses group the OR so status applies to both regions.`,r:`Birch Dental\nCedar Clinic\nElm Care\nFox Health`},
{q:`How is A OR B AND C read without parentheses?`,o:[`(A OR B) AND C`,`Left to right, in order`,`It is a syntax error`,`A OR (B AND C)`],a:3,e:`AND binds tighter than OR.`}],why:`AND before OR. Use parentheses whenever you mix them.`},
{g:"Level up",t:"DISTINCT and aliases",ty:"mc",br:`<code>DISTINCT</code> removes duplicate rows from the result. <code>AS</code> gives a column or table a readable name (an alias).<p><b>Worked example:</b> <code>SELECT DISTINCT status FROM accounts;</code> lists each status once.<pre>active
paused
trial</pre></p><div style="overflow-x:auto"><table><tr><th>id</th><th>name</th><th>region</th><th>status</th><th>mrr</th><th>signup</th></tr><tr><td>1</td><td>Birch Dental</td><td>East</td><td>active</td><td>400</td><td>2024-01-15</td></tr><tr><td>2</td><td>Cedar Clinic</td><td>West</td><td>active</td><td>650</td><td>2024-03-02</td></tr><tr><td>3</td><td>Dune Labs</td><td>East</td><td>paused</td><td>0</td><td>2024-03-20</td></tr><tr><td>4</td><td>Elm Care</td><td>West</td><td>active</td><td>NULL</td><td>2024-06-11</td></tr><tr><td>5</td><td>Fox Health</td><td>East</td><td>active</td><td>900</td><td>2025-01-09</td></tr><tr><td>6</td><td>Gale Vet</td><td>North</td><td>active</td><td>520</td><td>2025-02-18</td></tr><tr><td>7</td><td>Hill Optics </td><td>NULL</td><td>trial</td><td>0</td><td>2025-05-30</td></tr></table></div>`,Q:[{q:`List each region once.`,o:[`SELECT region DISTINCT FROM accounts;`,`SELECT DISTINCT region FROM accounts;`,`SELECT ONLY region FROM accounts;`,`SELECT region FROM accounts DISTINCT;`],a:1,e:`DISTINCT goes right after SELECT. NULL counts as its own value.`,r:`East\nWest\nNorth\nNULL`},
{q:`Show mrr under the heading monthly_revenue.`,o:[`SELECT name, monthly_revenue AS mrr FROM accounts;`,`SELECT name, mrr AS monthly_revenue FROM accounts;`,`SELECT name, mrr TO monthly_revenue FROM accounts;`,`SELECT name, mrr = monthly_revenue FROM accounts;`],a:1,e:`AS goes after the original name: original AS newname.`,r:`Birch Dental | 400\nCedar Clinic | 650\nDune Labs | 0\nElm Care | NULL\nFox Health | 900\nGale Vet | 520\nHill Optics  | 0`}],why:`DISTINCT removes repeats. AS renames for readability.`},
{g:"Level up",t:"Text clean-up",ty:"mc",br:`<code>TRIM</code> removes spaces at both ends, <code>UPPER</code>/<code>LOWER</code> change case, <code>SUBSTR(text, start, length)</code> cuts a piece. Many databases join text with <code>||</code>; others use CONCAT or +. Messy text is a top cause of rows that "go missing".<p><b>Worked example:</b> <code>SELECT UPPER(name) FROM accounts WHERE id = 2;</code> shows the name in capitals.<pre>CEDAR CLINIC</pre></p><div style="overflow-x:auto"><table><tr><th>id</th><th>name</th><th>region</th><th>status</th><th>mrr</th><th>signup</th></tr><tr><td>1</td><td>Birch Dental</td><td>East</td><td>active</td><td>400</td><td>2024-01-15</td></tr><tr><td>2</td><td>Cedar Clinic</td><td>West</td><td>active</td><td>650</td><td>2024-03-02</td></tr><tr><td>3</td><td>Dune Labs</td><td>East</td><td>paused</td><td>0</td><td>2024-03-20</td></tr><tr><td>4</td><td>Elm Care</td><td>West</td><td>active</td><td>NULL</td><td>2024-06-11</td></tr><tr><td>5</td><td>Fox Health</td><td>East</td><td>active</td><td>900</td><td>2025-01-09</td></tr><tr><td>6</td><td>Gale Vet</td><td>North</td><td>active</td><td>520</td><td>2025-02-18</td></tr><tr><td>7</td><td>Hill Optics </td><td>NULL</td><td>trial</td><td>0</td><td>2025-05-30</td></tr></table></div>`,Q:[{q:`Find names with stray spaces at either end.`,o:[`SELECT id, name FROM accounts WHERE name = TRIM(name);`,`SELECT id, name FROM accounts WHERE TRIM(name) IS NULL;`,`SELECT id, name FROM accounts WHERE name &lt;&gt; TRIM(name);`,`SELECT id, name FROM accounts WHERE name LIKE ' ';`],a:2,e:`If trimming changes the value, there were stray spaces.`,r:`7 | Hill Optics `},
{q:`Show the first 3 letters of each name.`,o:[`SELECT SUBSTR(name, 1, 3) FROM accounts;`,`SELECT SUBSTR(name, 3) FROM accounts;`,`SELECT SUBSTR(3, name) FROM accounts;`,`SELECT TRIM(name, 3) FROM accounts;`],a:0,e:`SUBSTR(text, start, length): start at 1, take 3.`,r:`Bir\nCed\nDun\nElm\nFox\nGal\nHil`}],why:`TRIM before comparing text, and compare cleaned values.`},
{g:"Level up",t:"NULL handling",ty:"mc",br:`<code>IS NOT NULL</code> keeps rows that have a value. <code>COALESCE(a, b)</code> returns the first value that is not NULL. <code>AVG</code> and <code>SUM</code> skip NULLs, so decide whether "missing" should mean zero.<p><b>Worked example:</b> <code>SELECT name, COALESCE(mrr, 0) FROM accounts WHERE id = 4;</code> shows 0 instead of NULL.<pre>Elm Care | 0</pre></p><div style="overflow-x:auto"><table><tr><th>id</th><th>name</th><th>region</th><th>status</th><th>mrr</th><th>signup</th></tr><tr><td>1</td><td>Birch Dental</td><td>East</td><td>active</td><td>400</td><td>2024-01-15</td></tr><tr><td>2</td><td>Cedar Clinic</td><td>West</td><td>active</td><td>650</td><td>2024-03-02</td></tr><tr><td>3</td><td>Dune Labs</td><td>East</td><td>paused</td><td>0</td><td>2024-03-20</td></tr><tr><td>4</td><td>Elm Care</td><td>West</td><td>active</td><td>NULL</td><td>2024-06-11</td></tr><tr><td>5</td><td>Fox Health</td><td>East</td><td>active</td><td>900</td><td>2025-01-09</td></tr><tr><td>6</td><td>Gale Vet</td><td>North</td><td>active</td><td>520</td><td>2025-02-18</td></tr><tr><td>7</td><td>Hill Optics </td><td>NULL</td><td>trial</td><td>0</td><td>2025-05-30</td></tr></table></div>`,Q:[{q:`Average mrr, treating missing mrr as 0.`,o:[`SELECT AVG(mrr) FROM accounts;`,`SELECT AVG(mrr, 0) FROM accounts;`,`SELECT COALESCE(AVG(mrr)) FROM accounts;`,`SELECT AVG(COALESCE(mrr, 0)) FROM accounts;`],a:3,e:`Plain AVG skips the NULL row and gives a higher average.`,r:`352.86`},
{q:`Accounts that have an mrr value recorded.`,o:[`SELECT name FROM accounts WHERE mrr &lt;&gt; NULL;`,`SELECT name FROM accounts WHERE mrr != 0;`,`SELECT name FROM accounts WHERE mrr IS NOT NULL;`,`SELECT name FROM accounts WHERE NOT mrr;`],a:2,e:`IS NOT NULL is the only reliable test. Zero is a value, NULL is not.`,r:`Birch Dental\nCedar Clinic\nDune Labs\nFox Health\nGale Vet\nHill Optics `}],why:`COALESCE fills gaps. AVG ignores NULLs unless you fill them.`},
{g:"Level up",t:"CASE WHEN",ty:"mc",br:`<code>CASE</code> builds a label from conditions. It checks <code>WHEN</code> lines top to bottom, the first match wins, and <code>ELSE</code> covers the rest.<p><b>Worked example:</b> <code>SELECT name, CASE WHEN mrr &gt;= 600 THEN 'large' ELSE 'small' END AS size FROM accounts WHERE id IN (2, 3);</code> labels each account.<pre>Cedar Clinic | large
Dune Labs | small</pre></p><div style="overflow-x:auto"><table><tr><th>id</th><th>name</th><th>region</th><th>status</th><th>mrr</th><th>signup</th></tr><tr><td>1</td><td>Birch Dental</td><td>East</td><td>active</td><td>400</td><td>2024-01-15</td></tr><tr><td>2</td><td>Cedar Clinic</td><td>West</td><td>active</td><td>650</td><td>2024-03-02</td></tr><tr><td>3</td><td>Dune Labs</td><td>East</td><td>paused</td><td>0</td><td>2024-03-20</td></tr><tr><td>4</td><td>Elm Care</td><td>West</td><td>active</td><td>NULL</td><td>2024-06-11</td></tr><tr><td>5</td><td>Fox Health</td><td>East</td><td>active</td><td>900</td><td>2025-01-09</td></tr><tr><td>6</td><td>Gale Vet</td><td>North</td><td>active</td><td>520</td><td>2025-02-18</td></tr><tr><td>7</td><td>Hill Optics </td><td>NULL</td><td>trial</td><td>0</td><td>2025-05-30</td></tr></table></div>`,Q:[{q:`Label accounts 'paying' if mrr &gt; 0, otherwise 'free'.`,o:[`SELECT name, CASE WHEN mrr &gt; 0 THEN 'paying' ELSE 'free' END AS plan FROM accounts;`,`SELECT name, IF mrr &gt; 0 THEN 'paying' ELSE 'free' FROM accounts;`,`SELECT name, CASE mrr &gt; 0 THEN 'paying' ELSE 'free' END FROM accounts;`,`SELECT name, CASE WHEN mrr &gt; 0 'paying' ELSE 'free' END FROM accounts;`],a:0,e:`CASE WHEN condition THEN value ... ELSE value END. Elm Care's NULL falls to ELSE.`,r:`Birch Dental | paying\nCedar Clinic | paying\nDune Labs | free\nElm Care | free\nFox Health | paying\nGale Vet | paying\nHill Optics  | free`},
{q:`Tiers: &gt;= 600 big, &gt;= 300 mid, else small. Which WHEN comes first?`,o:[`Check &gt;= 300 first`,`Order does not matter`,`Put ELSE first`,`Check &gt;= 600 first, then &gt;= 300`],a:3,e:`The first match wins, so test the highest threshold first.`}],why:`CASE labels rows. First match wins, so order matters.`},
{g:"Level up",t:"More aggregates",ty:"mc",br:`<code>MIN</code>, <code>MAX</code>, <code>AVG</code>, <code>SUM</code>; <code>COUNT(DISTINCT col)</code> counts unique values; <code>GROUP BY</code> can use several columns.<p><b>Worked example:</b> <code>SELECT MAX(mrr), MIN(mrr) FROM accounts;</code> highest and lowest mrr.<pre>900 | 0</pre></p><div style="overflow-x:auto"><table><tr><th>id</th><th>name</th><th>region</th><th>status</th><th>mrr</th><th>signup</th></tr><tr><td>1</td><td>Birch Dental</td><td>East</td><td>active</td><td>400</td><td>2024-01-15</td></tr><tr><td>2</td><td>Cedar Clinic</td><td>West</td><td>active</td><td>650</td><td>2024-03-02</td></tr><tr><td>3</td><td>Dune Labs</td><td>East</td><td>paused</td><td>0</td><td>2024-03-20</td></tr><tr><td>4</td><td>Elm Care</td><td>West</td><td>active</td><td>NULL</td><td>2024-06-11</td></tr><tr><td>5</td><td>Fox Health</td><td>East</td><td>active</td><td>900</td><td>2025-01-09</td></tr><tr><td>6</td><td>Gale Vet</td><td>North</td><td>active</td><td>520</td><td>2025-02-18</td></tr><tr><td>7</td><td>Hill Optics </td><td>NULL</td><td>trial</td><td>0</td><td>2025-05-30</td></tr></table></div>`,Q:[{q:`How many different regions have accounts?`,o:[`SELECT COUNT(region) FROM accounts;`,`SELECT COUNT(DISTINCT region) FROM accounts;`,`SELECT DISTINCT COUNT(region) FROM accounts;`,`SELECT COUNT(*) FROM accounts GROUP BY region;`],a:1,e:`COUNT(region) counts rows with a value, not unique values.`,r:`3`},
{q:`Accounts per region and status.`,o:[`SELECT region, status, COUNT(*) FROM accounts GROUP BY region;`,`SELECT region, status, COUNT(*) FROM accounts GROUP BY region, status;`,`SELECT region, status, COUNT(*) FROM accounts GROUP BY region AND status;`,`SELECT region, status, SUM(*) FROM accounts GROUP BY region, status;`],a:1,e:`List every non-aggregate column in GROUP BY, separated by commas.`,r:`NULL | trial | 1\nEast | active | 2\nEast | paused | 1\nNorth | active | 1\nWest | active | 2`}],why:`COUNT(DISTINCT) for uniques. GROUP BY several columns for finer groups.`},
{g:"Combine",t:"Join types",ty:"mc",br:`<code>INNER JOIN</code> keeps matched pairs only. <code>LEFT JOIN</code> keeps every left row, with NULLs when nothing matches. RIGHT JOIN is the mirror image (you can usually swap the tables and use LEFT). FULL JOIN keeps unmatched rows from both sides but is not in every database. Table <code>tickets</code>:<div style="overflow-x:auto"><table><tr><th>id</th><th>account_id</th><th>topic</th><th>priority</th></tr><tr><td>1</td><td>1</td><td>login</td><td>high</td></tr><tr><td>2</td><td>1</td><td>billing</td><td>low</td></tr><tr><td>3</td><td>2</td><td>login</td><td>low</td></tr><tr><td>4</td><td>9</td><td>export</td><td>high</td></tr><tr><td>5</td><td>5</td><td>billing</td><td>high</td></tr><tr><td>6</td><td>6</td><td>login</td><td>low</td></tr><tr><td>7</td><td>5</td><td>export</td><td>low</td></tr><tr><td>8</td><td>1</td><td>login</td><td>low</td></tr></table></div><p><b>Worked example:</b> <code>SELECT a.name, t.topic FROM accounts a INNER JOIN tickets t ON a.id = t.account_id WHERE t.id = 1;</code> matches ticket 1 to its account.<pre>Birch Dental | login</pre></p>Ticket 4 points to account 9, which does not exist.`,Q:[{q:`Every ticket with its account name; skip tickets with no matching account.`,o:[`SELECT t.id, a.name FROM tickets t LEFT JOIN accounts a ON a.id = t.account_id;`,`SELECT t.id, a.name FROM tickets t, accounts a;`,`SELECT t.id, a.name FROM tickets t INNER JOIN accounts a ON a.id = t.account_id;`,`SELECT t.id, a.name FROM tickets t INNER JOIN accounts a ON a.id = t.id;`],a:2,e:`INNER drops the orphan. LEFT would keep it with NULL. The ON must use the matching key.`,r:`1 | Birch Dental\n2 | Birch Dental\n3 | Cedar Clinic\n5 | Fox Health\n6 | Gale Vet\n7 | Fox Health\n8 | Birch Dental`},
{q:`Accounts that have no tickets at all.`,o:[`SELECT a.name FROM accounts a LEFT JOIN tickets t ON a.id = t.account_id WHERE t.id IS NULL;`,`SELECT a.name FROM accounts a INNER JOIN tickets t ON a.id = t.account_id WHERE t.id IS NULL;`,`SELECT a.name FROM accounts a LEFT JOIN tickets t ON a.id = t.account_id WHERE t.id = NULL;`,`SELECT a.name FROM accounts a LEFT JOIN tickets t ON a.id = t.account_id WHERE a.id IS NULL;`],a:0,e:`LEFT JOIN, then test the right side's key for NULL.`,r:`Dune Labs\nElm Care\nHill Optics `}],why:`INNER for matches only. LEFT plus IS NULL finds what's missing.`},

{g:"Check your data",t:"Safe changes",ty:"mc",br:`<code>INSERT</code> adds rows, <code>UPDATE</code> changes rows, <code>DELETE</code> removes rows. They change data, so work carefully: (1) run a SELECT with the same WHERE first, (2) check the row count, (3) use a transaction or backup if your system supports it, (4) never run UPDATE or DELETE without a WHERE unless you truly mean every row. Educational only; follow your team's change process.`,Q:[{q:`You need to set status to 'paused' for account 3. What comes first?`,o:[`Run the UPDATE immediately`,`Run UPDATE with no WHERE`,`Run SELECT * FROM accounts WHERE id = 3 and confirm one row`,`Delete the row and re-insert it`],a:2,e:`Preview the exact rows you are about to change.`},

function tg(k){sel.has(k)?sel.delete(k):sel.add(k);$("i"+k).classList.toggle("sel")}
function ckm(){const m=M[cur];let ok=true,o="";m.I.forEach((it,k)=>{const s=sel.has(k),c=!!it.c;if(s!=c)ok=false;o+=`<div>${s&&c?"✅ Right:":s?"❌ Shouldn't be selected:":c?"⚠ Missed:":"✓ Correctly left out:"} ${it.e}</div>`});
$("fb").innerHTML=`<div class=fb>${o}${ok?"":"<div><b>Adjust and check again.</b></div>"}</div>`;if(ok)win()}
function tr(k,j){ch[k]=j;M[cur].C.forEach((c,x)=>$(`c${k}_${x}`).classList.toggle("sel",x==j))}
function ckt(){const m=M[cur];if(m.I.some((_,k)=>ch[k]==null)){$("fb").innerHTML=`<div class=fb>Pick a category for every item.</div>`;return}
let ok=true,o="";m.I.forEach((it,k)=>{const r=ch[k]==it.a;if(!r)ok=false;o+=`<div>${r?"✅":"❌"} ${r?"":"Should be "+m.C[it.a]+". "}${it.e}</div>`});
$("fb").innerHTML=`<div class=fb>${o}${ok?"":"<div><b>Adjust and check again.</b></div>"}</div>`;if(ok)win()}
function mq(){const m=M[cur];if(mi>=m.Q.length){$("mq").innerHTML=`<div class=card>You got ${msc}/${m.Q.length}.</div>`;return win()}
const q=m.Q[mi];$("mq").innerHTML=`<div class=card><h2>${q.q}</h2>${q.o.map((o,k)=>`<button class=opt onclick="mp(${k},this)">${o}</button>`).join("")}${m.g!="Tickets"&&m.ty=="mc"?`<button class=g id=hb onclick="hint()">💡 Hint (-5 XP)</button><div id=hn></div>`:""}<div id=fb></div></div>`}
function hint(){$("hn").innerHTML=`<div class=fb>💡 ${M[cur].why}</div>`;$("hb").remove();S.xp=Math.max(0,S.xp-5);save()}
function mp(k,el){const q=M[cur].Q[mi];if(document.querySelector(".opt.ok,.opt.no"))return;const ok=k==q.a;if(ok)msc++;el.classList.add(ok?"ok":"no");
if(!ok)document.querySelectorAll(".opt")[q.a].classList.add("ok");$("fb").innerHTML=`<div class=fb>${ok?"✅ Correct.":"❌ Not quite."} ${q.e}${q.r?`<pre>${q.r}</pre>`:""}</div><button onclick="mi++;mq()">Next</button>`}
function fcs(){const m=M[cur];if(fi>=m.F.length){$("mq").innerHTML=`<div class=card>Deck done.</div>`;return win()}const c=m.F[fi];
$("mq").innerHTML=`<div class=card style="cursor:pointer" onclick="$('bk').hidden=false"><div class=mu>Card ${fi+1}/${m.F.length}. Answer aloud, then tap to flip.</div><h2>${c.f}</h2><div id=bk hidden><b>${c.b}</b></div></div><button onclick="fi++;fcs()">Next card</button>`}
function win(){if(won)return;won=true;const first=!S.done[cur];if(first){S.done[cur]=1;S.xp+=50;S.rv[cur]={s:0,d:ad(1)}}save();const m=M[cur];
$("win").innerHTML=`<div class="card win"><b>✅ Mission complete!${first?" +50 XP":""}</b><p>${m.why}</p>${m.say?`<div class=say>🎤 Say it out loud: ${m.say}</div>`:""}<button onclick="openM(${cur+1})">${cur+1<M.length?"Next mission":"Back to missions"}</button></div>`;$("win").scrollIntoView({behavior:"smooth"})}
home();
</script></body></html>
