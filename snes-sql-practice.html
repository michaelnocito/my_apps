return e.replace(new RegExp("'([^']*)'|"+AG+"|([A-Za-z_]\\w*)|(<>|!=)|(=)|(\\d+(?:\\.\\d+)?)|([<>]=?|[()])","gi"),(m,s,fn,ar,w,ne,eq,n,op)=>{if(s!==undefined)return JSON.stringify(s);if(fn){if(!hv)throw "COUNT, AVG and similar go in SELECT or HAVING, not WHERE.";return `g.${fn.toLowerCase()}("${ar}")`}if(w){const l=w.toLowerCase();if(l=="and")return"&&";if(l=="or")return"||";if(l=="not")return"!";if(hv)throw "HAVING uses totals like COUNT(*), not columns.";return "r."+ck(l)}if(ne)return"!=";if(eq)return"==";return m})}
function ev(e,rs,g){const a=e.match(new RegExp("^"+AG+"$","i"));if(a)return g[a[1].toLowerCase()](a[2]);return rs[0]?rs[0][ck(e)]:null}
function fx(a,b){try{return new Function(a,"return "+b)}catch(e){throw "That condition isn't valid SQL. Check the operators (use = not ==, and >= not =>) and the quotes."}}
function run(q){q=q.trim().replace(/;+\s*$/,"").replace(/\s+/g," ");
const m=q.match(/^select (.+?) from games(?: where (.+?))?(?: group by (.+?))?(?: having (.+?))?(?: order by (.+?))?(?: limit (\d+))?$/i);
if(!m)throw "Use this shape: SELECT ... FROM games WHERE ... GROUP BY ... ORDER BY ... LIMIT n (keep clauses in that order).";
const [,sel,wh,gb,hv,ob,lm]=m;let rows=D;
if(wh){const f=fx("r",conv(wh));rows=rows.filter(r=>f(r))}
let items=[];sel.split(",").map(s=>s.trim()).forEach(s=>{if(s=="*")COLS.forEach(c=>items.push({e:c,l:c,t:c}));else{const a=s.match(/^(.+?) as (\w+)$/i),e=a?a[1]:s;items.push({e:e,l:(a?a[2]:e).toLowerCase().replace(/\s/g,""),t:a?a[2]:e})}});
let out;
if(items.some(i=>/\(/.test(i.e))||gb){const keys=gb?gb.split(",").map(x=>ck(x.trim())):[],grp=new Map();rows.forEach(r=>{const k=keys.map(c=>r[c]).join("|");if(!grp.has(k))grp.set(k,[]);grp.get(k).push(r)});if(!keys.length&&!grp.size)grp.set("",[]);
out=[...grp.values()].map(rs=>({rs,vals:items.map(i=>ev(i.e,rs,G(rs)))}));
if(hv){const f=fx("g",conv(hv,1));out=out.filter(o=>f(G(o.rs)))}}
else out=rows.map(r=>({rs:[r],vals:items.map(i=>ev(i.e,[r],null))}));
if(ob){const ks=ob.split(",").map(x=>{const p=x.trim().match(/^(.+?)(?: (asc|desc))?$/i);return{k:p[1].toLowerCase().replace(/\s/g,""),d:/desc/i.test(p[2]||"")?-1:1}});
ks.forEach(o=>{if(!items.some(t=>t.l==o.k||t.e.toLowerCase().replace(/\s/g,"")==o.k))ck(o.k)});
out.sort((a,b)=>{for(const {k,d} of ks){const i=items.findIndex(t=>t.l==k||t.e.toLowerCase().replace(/\s/g,"")==k);let x,y;if(i>=0){x=a.vals[i];y=b.vals[i]}else{x=a.rs[0][k];y=b.rs[0][k]}if(x<y)return -d;if(x>y)return d}return 0})}
if(lm)out=out.slice(0,+lm);
return{cols:items.map(i=>i.t),rows:out.map(o=>o.vals)}}

{t:"Sort the best first",x:["SORT BY","ORDER","ASC","GROUP BY","BY","HIGHEST"],k:"Show name, category, quality for games with learning = 1 AND quality >= 4, sorted by quality highest first, then by name A to Z.",h:"SELECT name, category, quality FROM games WHERE learning = 1 AND quality >= 4 ORDER BY ___ DESC, ___;",o:1,a:"SELECT name, category, quality FROM games "+W+" ORDER BY quality DESC, name;",w:"ORDER BY goes after WHERE. DESC means highest first."},

let S={xp:0,done:{},shown:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)))}catch(e){}

function home(){const n=Object.keys(S.done).length;let h=`<div class=top><h1>SNES SQL Practice</h1><span class=xp>⚡ ${S.xp} XP</span></div><div class=card><b>Question:</b> which SNES games are best for a total beginner?<div class=mu>Table <code>games</code> has ${D.length} rows. Type queries yourself and run them. Reading data only: nothing can be changed. ${n} of ${ST.length} steps done.</div></div>`;

const KW=/^(select|from|where|and|or|not|group|by|having|order|limit|desc|asc|as)$/i,FN=/^(count|avg|sum|min|max)$/i;
function hl(v){return v.replace(/('[^']*'?)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\d+(?:\.\d+)?)|([\s\S])/g,(m,q,fn,w,n,o)=>{if(q)return `<span class=ts>${esc(q)}</span>`;if(fn)return FN.test(fn)?`<span class=tf>${fn}</span>`:KW.test(fn)?`<span class=tk>${fn}</span>`:esc(fn);if(w){const l=w.toLowerCase();return KW.test(w)?`<span class=tk>${w}</span>`:(COLS.includes(l)||l=="games")?`<span class=tc>${w}</span>`:esc(w)}if(n)return `<span class=tn>${n}</span>`;return esc(o)})}
let hist=[];
function toks(a){return a.match(/'[^']*'|FROM games|ORDER BY|GROUP BY|(?:COUNT|AVG|SUM|MIN|MAX)\(\*?\)|\d+|[A-Za-z_]\w*|>=|<=|!=|[=<>,;()*]/gi)}
const KO=["SELECT","FROM games","FROM game","WHERE","GROUP BY","GROUP","HAVING","ORDER BY","ORDER","SORT BY","BY","LIMIT","TOP","AND","OR","NOT","IS","ASC","DESC","AS"],SY=["=","==","!=",">","<",">=","<=","=>","=<","&&",",","(",")","*",";"],COLISH=["level","learning curve"];
const cmp=(a,b)=>{a=a.toLowerCase();b=b.toLowerCase();return a<b?-1:a>b?1:0},nm=x=>/^\d+$/.test(x);
function gr(t){if(KO.includes(t))return 0;if(/^(count|avg|sum|min|max|total)\b/i.test(t))return 1;if(COLS.includes(t.toLowerCase())||COLISH.includes(t))return 2;if(/^[,;()*=<>!&]+$/.test(t))return 4;return 3}
function mk(i){const sol=[...new Set(toks(ST[i].a))],g=[[],[],[],[],[]];sol.concat((ST[i].x||[]).filter(x=>!sol.includes(x))).forEach(t=>g[gr(t)].push(t));
g[0].sort((a,b)=>KO.indexOf(a)-KO.indexOf(b));g[1].sort(cmp);g[2].sort(cmp);g[3].sort((a,b)=>nm(a)!=nm(b)?nm(a)-nm(b):nm(a)?a-b:cmp(a,b));g[4].sort((a,b)=>SY.indexOf(a)-SY.indexOf(b));return g}
function sync(){$("hl").innerHTML=hl($("q").value)+"\n"}
function add(t){const q=$("q");let v=q.value.replace(/\s+$/,"");hist.push(q.value);if(/^\d$/.test(t)&&/\d$/.test(v))v+=t;else v+=((!v||/\($/.test(v)||/^[,;)]$/.test(t))?"":" ")+t;q.value=v;sync()}
function kb(){const q=$("q"),on=q.hasAttribute("readonly");if(on){q.removeAttribute("readonly");q.removeAttribute("inputmode");q.focus()}else{q.setAttribute("readonly","");q.setAttribute("inputmode","none");q.blur()}$("kb").textContent=on?"⌨ Hide keyboard":"⌨ Keyboard"}
function undo(){const q=$("q");q.value=hist.length?hist.pop():q.value.slice(0,-1);sync()}

A.innerHTML=`<button class=back onclick="home()">← Steps</button><h2>${i+1}. ${s.t}</h2><div class=card>${esc(s.k)}<div class=mu style="margin-top:6px">${s.ft?"✍️ Free type: use the keyboard or the buttons.":"Tap the buttons to build your query. Tap ⌨ Keyboard if you get stuck."}</div></div><div class=card><div class=ed><pre id=hl></pre><textarea id=q ${s.ft?"":"readonly inputmode=none"} autocapitalize=off autocorrect=off spellcheck=false oninput="sync()"></textarea></div><div class=cats style="margin-top:8px"><button class=g onclick="undo()">⌫ Undo</button><button class=g onclick="clr()">Clear</button><button class=g id=kb onclick="kb()">${s.ft?"⌨ Hide keyboard":"⌨ Keyboard"}</button></div><div class=cats id=pal style="margin-top:6px"></div><button onclick="doRun()">Run and check</button><button class=g onclick="$('hn').innerHTML='<div class=fb>💡 '+esc(ST[cur].h)+'</div>'">Hint</button><button class=g onclick="showA()">Show answer (no XP)</button><div id=hn></div></div><div id=win></div><div id=res></div>`;sync();pal(i)}
