<!DOCTYPE html>
<html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>Study Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--pr:#e11d74;--ok:#16a34a;--bd:#e3e6ef;--code:#eef0f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--pr);margin:22px 0 6px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:8px 0}
.win{border:2px solid var(--ok)}.tap{cursor:pointer}
button,.btn{display:block;width:100%;font:inherit;font-weight:700;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px 16px;margin-top:10px;background:var(--pr);color:#fff;cursor:pointer}
.g{background:var(--code);color:var(--tx)}
.skip,.back{background:none;color:var(--mu);font-weight:600;padding:10px;margin-top:6px}.back{width:auto;padding:4px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--bd);cursor:pointer}.row:first-of-type{margin-top:8px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:"+";float:right;color:var(--mu);font-size:20px}details[open]>summary::after{content:"\2212"}
input,select,textarea{display:block;width:100%;font:inherit;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin-top:8px}
input[type=checkbox]{width:auto;padding:0;margin:5px 0 0}label.card{display:flex;gap:12px;align-items:flex-start}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;margin:0;border-radius:0;background:none;color:var(--mu);padding:10px 4px;font-size:13px}nav button.on{color:var(--pr)}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const KEY="studyDash",INT=[1,3,7,14,30,60];
const LIBD=[["API and integrations",[["API Crash Course","Foundations, endpoints, JSON, status codes","api-course.html"],["API Support Tickets","Realistic troubleshooting scenarios","api-scenarios.html"],["JSON for Field Mappers","Types, nesting, syntax, tickets","json-course.html"],["JSON Arrays Deep Dive","Arrays and nested data","json-arrays-deep-dive.html"],["Endpoints Deep Dive","URLs, methods, parameters, environments","endpoints-deep-dive.html"],["API Practice Lab","Simulated API to send and fix requests","api-practice-lab.html"]]],["SQL",[["SQL Fundamentals","Core SQL: tables, SELECT, WHERE, JOINs, grouping","sql-fundamentals-course.html"],["SQL Fundamentals 2","Smarter filters, CASE, joins, subqueries, data checks","sql-fundamentals-2.html"],["SNES SQL Practice","Hands-on queries, one step at a time","snes-sql-practice.html"]]],["Implementation",[["SaaS Implementation Lab","Process, migration, UAT, go-live","saas-implementation-lab.html"],["Fast-Track Implementation Lab","Right-sizing a long implementation","fast-track-implementation-lab.html"],["Project Momentum Lab","Unresponsive customers and records","project-momentum-lab.html"]]],["Learning",[["Learn Faster, Remember Longer","Memory science for tech learning","memory-course.html"],["Learning Science: Fundamentals","Memory, attention, and retention","learning-science-fundamentals.html"],["Anticipation Lab","Anticipation, avoidance, and practical tools","anticipation-lab.html"],["Five Rings","Musashi's strategy for daily life","five-rings-course.html"]]]];
let P=[];try{const x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x))P=x.filter(p=>p&&p.n&&Array.isArray(p.i))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),td=()=>dk(new Date()),ad=n=>{const d=new Date();d.setDate(d.getDate()+n);return dk(d)},fd=d=>new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const $=id=>document.getElementById(id),A=$("app"),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"),ok=u=>/^https?:\/\//i.test(u)||/^[\w\-.\/]+$/.test(u),base=u=>String(u||"").split("?")[0].split("#")[0].split("/").pop().toLowerCase();
let V="t",cj={a:0,b:0},nsk=0,more=false,op=-1,LIB=null,busy=false;
const mk=n=>({n,last:"",i:[]}),flat=()=>P.flatMap((p,a)=>p.i.map((it,b)=>({a,b,it}))),dueL=()=>flat().filter(x=>x.it.s!=null&&x.it.d<=td()).sort((x,y)=>x.it.d<y.it.d?-1:x.it.d>y.it.d?1:x.a-y.a);
const lk=(it,t,c)=>it.l&&ok(it.l)?`<a class="btn ${c||""}" href="${esc(it.l)}" target=_blank rel=noopener>${t} ↗</a>`:"";
const st=it=>it.s==null?"New":it.d<=td()?"Due":"Next "+fd(it.d),TAB={t:"t",r:"t",l:"l",d:"l",b:"l",a:"a",i:"a"};
function R(){$("nav").innerHTML=[["t","📅","Today"],["l","📚","My list"],["a","➕","Add"]].map(x=>`<button class="${TAB[V]==x[0]?"on":""}" onclick="V='${x[0]}';R()">${x[1]}<br>${x[2]}</button>`).join("");({t:today,r:rev,l:list,d:item,b:bk,a:add,i:imp})[V]();scrollTo(0,0)}
function openLib(){LIB=null;V="i";R()}
const how=()=>`<details class=card><summary><b>How this works</b></summary><div class=mu style="margin-top:8px">1. Each day, learn one new thing from Today.<br>2. Tap "I learned it". Your first review is set for tomorrow.<br>3. When something is due, try to recall it first, then check.<br>4. Tap "Got it" and the next review moves further out (1, 3, 7, 14, 30, 60 days). Tap "Missed some" and it comes back tomorrow.</div></details>`;
function nextNew(){const ps=P.map((p,i)=>({i,l:p.last||"",n:p.i.findIndex(x=>x.s==null)})).filter(x=>x.n>=0).sort((a,b)=>a.l<b.l?-1:a.l>b.l?1:a.i-b.i);return ps.length?ps[nsk%ps.length]:null}
function today(){const d=dueL(),f=flat(),t=td();
if(!f.length){A.innerHTML=`<h1>Welcome</h1><div class=mu>Learn one small thing a day. This app schedules reviews so it sticks.</div><div class=card><b>Get started</b><div class=mu>Choose the apps you want to study.</div><button onclick="openLib()">Choose apps</button><button class=g onclick="V='a';R()">Or add my own</button></div>`+how();return}
let h=`<h1>Today</h1><div class=mu>${d.length} to review · ${f.filter(x=>x.it.s!=null).length} of ${f.length} started</div><h2>Review</h2>`;
h+=d.length?d.map(x=>`<div class="card tap" onclick="cj={a:${x.a},b:${x.b}};V='r';R()"><b>${esc(x.it.t)}</b><div class=mu>${esc(P[x.a].n)} · tap to review ›</div></div>`).join(""):`<div class=card>✅ Nothing to review today.</div>`;
h+=`<h2>Learn next</h2>`;
if(d.length>10)h+=`<div class=card>⏸ ${d.length} reviews are waiting. Clear them before learning new things.</div>`;
else if(P.some(p=>p.last==t)&&!more)h+=`<div class="card win"><b>✅ You learned something new today.</b><div class=mu>That is enough. Come back tomorrow.</div><button class=g onclick="more=true;R()">Learn another anyway</button></div>`;
else{const n=nextNew();if(!n)h+=`<div class=card>You have started everything. Add more under Add.</div>`;else{const it=P[n.i].i[n.n];h+=`<div class=card><div class=mu>${esc(P[n.i].n)}</div><b>${esc(it.t)}</b>${lk(it,"Open")}<button class=g onclick="learn(${n.i},${n.n})">I learned it ✓</button><button class=skip onclick="nsk++;R()">Skip for now</button></div>`}}
A.innerHTML=h+how()}
function learn(a,b,v){const it=P[a].i[b];it.s=0;it.d=ad(1);P[a].last=td();nsk=0;more=false;save();V=v||"t";R()}
function rev(){const {a,b}=cj,it=P[a]&&P[a].i[b];if(!it){V="t";return R()}
A.innerHTML=`<button class=back onclick="V='t';R()">← Today</button><div class=mu>${esc(P[a].n)}</div><h1>${esc(it.t)}</h1><div class=card><b>1. Recall</b><div class=mu>Say or write what you remember. Do not peek yet.</div></div><div class=card><b>2. Check</b><div class=mu>Open it and compare.</div>${lk(it,"Open to check","g")}</div><div class=card><b>3. How did it go?</b><button onclick="grade(1)">Got it ✓</button><button class=g onclick="grade(0)">Missed some</button><div class=mu style="margin-top:8px">Missed items come back tomorrow.</div></div>`}
function grade(o){const it=P[cj.a].i[cj.b];if(o){it.s=Math.min(it.s+1,INT.length-1);it.d=ad(INT[it.s])}else{it.s=0;it.d=ad(1)}save();V="t";R()}
function list(){let h=`<h1>My list</h1>`;if(!flat().length)h+=`<div class=card>Nothing here yet.<button onclick="V='a';R()">Add something</button></div>`;
P.forEach((p,i)=>{const n=p.i.filter(x=>x.s!=null).length,du=p.i.filter(x=>x.s!=null&&x.d<=td()).length;h+=`<details class=card ${op==i?"open":""}><summary><b>${esc(p.n)}</b><div class=mu>${n} of ${p.i.length} started${du?" · "+du+" due":""}</div></summary>${p.i.map((it,j)=>`<div class=row onclick="cj={a:${i},b:${j}};op=${i};V='d';R()"><span>${esc(it.t)}</span><span class=mu>${st(it)} ›</span></div>`).join("")}<button class=skip onclick="delP(${i})">Delete this topic</button></details>`});
A.innerHTML=h+`<button class=g onclick="V='b';R()">Backup / restore</button>`}
function item(){const {a,b}=cj,p=P[a],it=p&&p.i[b];if(!it){V="l";return R()}
A.innerHTML=`<button class=back onclick="V='l';R()">← My list</button><div class=mu>${esc(p.n)}</div><h1>${esc(it.t)}</h1><div class=mu>${it.s==null?"Not started yet":"Next review "+fd(it.d)+" · review "+(it.s+1)}</div>${lk(it,"Open")}${it.s==null?`<button onclick="learn(${a},${b},'d')">I learned it today ✓</button>`:""}<button class=g onclick="setL()">${it.l?"Change link":"Add a link"}</button><button class=skip onclick="delI()">Delete this item</button>`}
function setL(){const it=P[cj.a].i[cj.b],u=prompt("Link (https://...). Leave blank to remove.",it.l||"");if(u===null)return;const v=u.trim();if(v&&!ok(v)){alert("Start the link with https://");return}it.l=v;save();R()}
function delI(){if(confirm("Delete this item?")){P[cj.a].i.splice(cj.b,1);save();V="l";R()}}
function delP(i){if(confirm("Delete this whole topic?")){P.splice(i,1);op=-1;save();R()}}
function add(){A.innerHTML=`<h1>Add</h1><div class=card><b>From the app library</b><div class=mu>Choose from the apps on this site.</div><button onclick="openLib()">Browse apps</button></div><div class=card><b>My own</b><div class=mu>An outside app, site, book or video. The link is optional.</div><input id=ni placeholder="Name"><input id=nu placeholder="Link (https://...)"><select id=ns onchange="$('nt').style.display=this.value=='n'?'block':'none'">${P.map((p,i)=>`<option value=${i}>${esc(p.n)}</option>`).join("")}<option value=n>New topic...</option></select><input id=nt placeholder="New topic name" style="display:${P.length?"none":"block"}"><button onclick="addOne()">Add to my list</button><details style="margin-top:12px"><summary class=mu>Add several at once</summary><div class=mu style="margin-top:6px">One per line. Put a link after a | like: Scales | https://example.com</div><textarea id=nl rows=4></textarea><button class=g onclick="addMany()">Add all</button></details></div>`}
function topicFor(){const v=$("ns").value;if(v!="n")return P[+v];const n=$("nt").value.trim()||"My items";let p=P.find(x=>x.n.toLowerCase()==n.toLowerCase());if(!p){p=mk(n);P.push(p)}return p}
function addOne(){const t=$("ni").value.trim(),u=$("nu").value.trim();if(!t){alert("Give it a name.");return}if(u&&!ok(u)){alert("Start the link with https://");return}const p=topicFor();p.i.push({t,l:u,s:null,d:null});op=P.indexOf(p);save();V="l";R()}
function addMany(){const l=$("nl").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!l.length)return;const p=topicFor();l.forEach(x=>{const q=x.split("|"),t=q[0].trim(),u=(q[1]||"").trim();if(t)p.i.push({t,l:ok(u)?u:"",s:null,d:null})});op=P.indexOf(p);save();V="l";R()}
async function loadLib(){try{const r=await fetch("index.html",{cache:"no-store"});if(!r.ok)throw 0;const dc=new DOMParser().parseFromString(await r.text(),"text/html"),L=[];let s=null;dc.querySelectorAll("main h2, main a").forEach(e=>{if(e.tagName=="H2"){s={n:e.textContent.trim(),a:[]};L.push(s)}else if(s){const h=e.getAttribute("href"),sp=e.querySelector("span"),t=[...e.childNodes].filter(n=>n.nodeType==3).map(n=>n.textContent).join("").trim();if(h&&t&&ok(h)&&base(h)!="study-dashboard.html")s.a.push({t,h,d:sp?sp.textContent.trim():""})}});LIB=L.filter(x=>x.a.length);if(!LIB.length)throw 0}catch(e){LIB=LIBD.map(([n,a])=>({n,a:a.map(([t,d,h])=>({t,d,h}))}))}}
function imp(){let h=`<button class=back onclick="V='a';R()">← Add</button><h1>App library</h1><div class=mu>Tick the apps you want. Each goes into a topic named for its section.</div>`;
if(!LIB){A.innerHTML=h+`<div class=card>Loading...</div>`;if(!busy){busy=true;loadLib().then(()=>{busy=false;if(V=="i")R()})}return}
const hv=new Set(P.flatMap(p=>p.i.map(x=>base(x.l))).filter(Boolean));
LIB.forEach((s,si)=>{h+=`<h2>${esc(s.n)}</h2>`;s.a.forEach((a,ai)=>{const dn=hv.has(base(a.h));h+=`<label class=card><input type=checkbox id="c${si}_${ai}" ${dn?"disabled":""}><span><b>${esc(a.t)}</b>${dn?' <span class=mu>· added</span>':""}<br><span class=mu>${esc(a.d)}</span></span></label>`})});
A.innerHTML=h+`<button onclick="doImp()">Add selected</button><button class=g onclick="document.querySelectorAll('input[type=checkbox]:not(:disabled)').forEach(c=>c.checked=true)">Select all new</button>`}
function doImp(){let n=0,last=null;LIB.forEach((s,si)=>{const pick=s.a.filter((a,ai)=>{const c=$("c"+si+"_"+ai);return c&&c.checked&&!c.disabled});if(!pick.length)return;let p=P.find(x=>x.n.toLowerCase()==s.n.toLowerCase());if(!p){p=mk(s.n);P.push(p)}pick.forEach(a=>{p.i.push({t:a.t,l:a.h,s:null,d:null});n++});last=p});if(!n){alert("Tick at least one app.");return}op=P.indexOf(last);save();V="t";R()}
function bk(){A.innerHTML=`<button class=back onclick="V='l';R()">← My list</button><h1>Backup / restore</h1><div class=card><div class=mu>Your list lives only on this device. Copy this text and keep it somewhere safe.</div><textarea rows=6 readonly onclick="this.select()">${esc(JSON.stringify(P))}</textarea></div><div class=card><b>Restore</b><div class=mu>Paste a backup to replace your list.</div><textarea id=rt rows=4 placeholder="Paste backup text"></textarea><button onclick="rs()">Restore</button><div id=rm></div></div><button class=skip onclick="if(confirm('Delete everything and start over?')){P=[];op=-1;save();V='t';R()}">Start over</button>`}
function rs(){try{const x=JSON.parse($("rt").value);if(!Array.isArray(x)||!x.every(p=>p&&p.n&&Array.isArray(p.i)))throw 0;P=x;save();V="l";R()}catch(e){$("rm").innerHTML=`<div class=mu>That text is not a valid backup.</div>`}}
R();
</script></body></html>
