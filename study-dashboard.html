<!DOCTYPE html>
<html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>Study Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--pr:#e11d74;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ef;--code:#eef0f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.xp{background:var(--pr);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.day{font-size:12px;font-weight:700;color:var(--pr);text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{width:34px;height:34px;border-radius:50%;background:var(--code);display:grid;place-items:center;font-weight:700;flex:none}
.done .dot{background:var(--ok);color:#fff}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%;margin-top:10px}
button.g{background:var(--code);color:var(--tx)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);font-weight:500;margin-top:8px}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.opt.no{border-color:var(--bad);background:rgba(220,38,38,.12)}.opt.sel{border-color:var(--pr);background:rgba(225,29,116,.1)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.cats button{width:auto;margin:0;padding:6px 10px;font-size:13px}.cats button.sel{background:var(--pr);color:#fff}
.win{border:2px solid var(--ok)}.f{margin:12px 0;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.back{background:none;color:var(--mu);width:auto;padding:4px 0;margin:0}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:var(--code);font-size:15px}
.fb div{margin:4px 0}.pl{padding:8px;margin:6px 0;border-radius:10px;background:var(--code);font-size:15px}
.say{margin-top:8px;padding:10px;border-radius:10px;background:rgba(22,163,74,.14);border:1px solid var(--ok);font-size:15px}
pre{background:var(--code);padding:8px;border-radius:8px;font-size:13px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}code{background:var(--code);padding:1px 5px;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid var(--bd);padding:5px;text-align:left}
input,textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin-top:8px}.lk{display:block;margin:8px 0 0;color:var(--pr);font-weight:600}</style></head><body><div id="app"></div>
<script>
const KEY="studyDash",GH="",INT=[1,3,7,14,30,60];
const U={sql:GH+"sql-fundamentals-course.html",snes:GH+"snes-sql-practice.html",ls:GH+"learning-science-fundamentals.html",ft:GH+"fast-track-implementation-lab.html"};
const mk=(n,a)=>({n,last:"",i:a.map(t=>Array.isArray(t)?{t:t[0],l:t[1],s:null,d:null}:{t,l:"",s:null,d:null})});
const w=(a,l)=>a.map(t=>[t,l]);
const defaults=()=>[
mk("SQL",w(["Start here: what is SQL?","Tables, rows, columns","SELECT and FROM","WHERE filters rows","Clause order","NULL: the missing value","Counting and grouping","WHERE vs HAVING","JOINs","Safe habits","Ticket: Duplicate records","Ticket: Missing matches","Ticket: Counts don't match","SQL flashcards"],U.sql).concat(w(["SNES 1: Look at the data","SNES 2: Easy to learn","SNES 3: Count them","SNES 4: Add quality","SNES 5: Sort the best first","SNES 6: Relaxed and solo","SNES 7: Picks per category","SNES 8: Final answer"],U.snes))),
mk("Learning science",w(["What learning is","Working memory and load","Attention and focus","Neurons, synapses, plasticity","Memory systems in the brain","Sleep, consolidation, chemistry","Types of memory","Encoding and forgetting","Retrieval and spacing","Illusions and your plan","Reviewing old while learning new","Learning science flashcards"],U.ls)),
mk("Implementation",w(["Right-sizing: the big idea","Where the time goes","Intake before kickoff","Standard patterns","Third parties set the pace","Right-sized data","Test sequence","Minimum launch gates","One-page handoff","Ticket: Stalled approval","Ticket: Custom asks at kickoff","Ticket: Test fails on day 9","Fast-track flashcards"],U.ft).concat(w(["SaaS Implementation Lab (whole app)"],GH+"saas-implementation-lab.html"),w(["Project Momentum Lab (whole app)"],GH+"project-momentum-lab.html"))),
mk("Technical implementation",[["API course (whole app)",GH+"api-course.html"],["API scenarios (whole app)",GH+"api-scenarios.html"],["JSON course (whole app)",GH+"json-course.html"],["JSON arrays deep dive (whole app)",GH+"json-arrays-deep-dive.html"],["Endpoints deep dive (whole app)",GH+"endpoints-deep-dive.html"],["API practice lab (whole app)",GH+"api-practice-lab.html"]]),
mk("Immovable mind",[["Five Rings course (whole app)",GH+"five-rings-course.html"],"Fudoshin: the immovable mind (concept)"]),
mk("Music",["Beat and tempo","Rhythm and time signatures","Notes and the staff","The major scale","Intervals","Major and minor chords","Chord progressions","Key signatures","Ear training: intervals","Building a practice routine"])];
let P=defaults();try{const x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)P=x}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),td=()=>dk(new Date()),ad=n=>{const d=new Date();d.setDate(d.getDate()+n);return dk(d)},fd=d=>new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const ok=u=>/^https?:\/\//i.test(u)||/^[\w\-.\/]+$/.test(u),$=id=>document.getElementById(id),A=$("app"),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let V="t",pi=0,cj={a:0,b:0},nsk=0,more=false;
const flat=()=>P.flatMap((p,a)=>p.i.map((it,b)=>({a,b,it}))),dueL=()=>flat().filter(x=>x.it.s!=null&&x.it.d<=td()).sort((x,y)=>x.it.d<y.it.d?-1:x.it.d>y.it.d?1:x.a-y.a);
const nav=()=>`<div class=cats style="margin:8px 0"><button class="g ${V=="t"?"sel":""}" onclick="V='t';R()">Today</button><button class="g ${V!="t"?"sel":""}" onclick="V='p';R()">Paths</button></div>`;
const lk=(it,t)=>it.l&&ok(it.l)?`<a class=lk href="${esc(it.l)}" target=_blank rel=noopener>${t} ↗</a>`:"";
function R(){({t:today,p:paths,x:path,r:rev,b:bk,i:imp})[V]()}
function nextNew(){const ps=P.map((p,i)=>({i,l:p.last||"",n:p.i.findIndex(x=>x.s==null)})).filter(x=>x.n>=0).sort((a,b)=>a.l<b.l?-1:a.l>b.l?1:a.i-b.i);return ps.length?ps[nsk%ps.length]:null}
function today(){const d=dueL(),f=flat(),t=td();let h=`<div class=top><h1>Study Dashboard</h1></div>`+nav();
h+=`<div class=mu>${d.length} due · ${f.filter(x=>x.it.d==ad(1)).length} tomorrow · ${f.filter(x=>x.it.s!=null).length} of ${f.length} lessons started</div>`;
h+=d.length?`<div class=day>Review first (${d.length})</div>`+d.map(x=>`<div class="card les" onclick="cj={a:${x.a},b:${x.b}};V='r';R()"><div class=dot>🔁</div><div><b>${esc(x.it.t)}</b><div class=mu>${esc(P[x.a].n)}</div></div></div>`).join(""):`<div class=card>✅ Nothing due today.</div>`;
h+=`<div class=day>New today</div>`;
if(d.length>10)h+=`<div class=card>⏸ Pause new lessons: ${d.length} reviews are waiting. Clear them first.</div>`;
else if(P.some(p=>p.last==t)&&!more)h+=`<div class="card win"><b>✅ New lesson done today.</b><button class=g onclick="more=true;R()">Add another anyway</button></div>`;
else{const n=nextNew();if(!n)h+=`<div class=card>No unstarted lessons. Add some under Paths.</div>`;else{const it=P[n.i].i[n.n];h+=`<div class=card><div class=mu>${esc(P[n.i].n)}</div><b>${esc(it.t)}</b>${lk(it,"Open the lesson")}<button onclick="learn(${n.i},${n.n})">✅ Learned it today</button><button class=g onclick="nsk++;R()">Different path</button></div>`}}
A.innerHTML=h}
function learn(a,b,v){const it=P[a].i[b];it.s=0;it.d=ad(1);P[a].last=td();nsk=0;more=false;save();V=v||"t";R()}
function rev(){const {a,b}=cj,it=P[a].i[b];A.innerHTML=`<button class=back onclick="V='t';R()">← Today</button><div class=mu>${esc(P[a].n)}</div><h2>${esc(it.t)}</h2><div class=card><b>Recall first.</b> Write or say everything you remember about this. Then check.${lk(it,"Open the lesson to check")}<div class=mu style="margin-top:6px">If you missed parts, redo only those parts.</div></div><div class=card>How did it go?<button onclick="grade(1)">✅ Got it</button><button class=g onclick="grade(0)">❌ Missed some</button></div>`}
function grade(ok){const it=P[cj.a].i[cj.b];if(ok){it.s=Math.min(it.s+1,INT.length-1);it.d=ad(INT[it.s])}else{it.s=0;it.d=ad(1)}save();V="t";R()}
function paths(){let h=`<div class=top><h1>Paths</h1></div>`+nav();P.forEach((p,i)=>{const n=p.i.filter(x=>x.s!=null).length,du=p.i.filter(x=>x.s!=null&&x.d<=td()).length;h+=`<div class="card les" onclick="pi=${i};V='x';R()"><div class=dot>${i+1}</div><div><b>${esc(p.n)}</b><div class=mu>${n} of ${p.i.length} started${du?" · "+du+" due":""}</div></div></div>`});
h+=`<div class=card><b>Add a path</b><input id=np placeholder="Path name"><button onclick="addP()">Add path</button></div><button onclick="V='i';LIB=null;IMSG='';R()">Import from app library</button><button class=g onclick="V='b';R()">Backup / restore</button>`;A.innerHTML=h}
function path(){const p=P[pi];let h=`<button class=back onclick="V='p';R()">← Paths</button><h2>${esc(p.n)}</h2>`;p.i.forEach((it,j)=>{h+=`<div class=card><b>${esc(it.t)}</b><div class=mu>${it.s==null?"Not started":"Next review "+fd(it.d)+" · review "+(it.s+1)}</div>${lk(it,"Open")}<div class=cats>${it.s==null?`<button onclick="learn(${pi},${j},'x')">✅ Learned today</button>`:""}<button class=g onclick="setL(${j})">${it.l?"Edit link":"Add link"}</button><button class=g onclick="delI(${j})">Delete</button></div></div>`});
h+=`<div class=card><b>Add one item</b><div class=mu>Link is optional. Use it for any outside app or site.</div><input id=ni placeholder="Name (e.g. Piano practice app)"><input id=nu placeholder="Link (https://…) optional"><button onclick="addOne()">Add</button></div><div class=card><b>Add many</b><div class=mu>One per line. Add a link after a | like: Scales | https://example.com</div><textarea id=nl rows=4></textarea><button onclick="addI()">Add</button></div><button class=g onclick="delP()">Delete this path</button>`;A.innerHTML=h}
function addP(){const n=$("np").value.trim();if(!n)return;P.push(mk(n,[]));pi=P.length-1;save();V="x";R()}
function addI(){const l=$("nl").value.split("\n").map(x=>x.trim()).filter(Boolean);l.forEach(x=>{const q=x.split("|"),t=q[0].trim(),u=(q[1]||"").trim();if(t)P[pi].i.push({t,l:ok(u)?u:"",s:null,d:null})});save();R()}
function addOne(){const t=$("ni").value.trim(),u=$("nu").value.trim();if(!t)return;if(u&&!ok(u)){alert("Start the link with https://");return}P[pi].i.push({t,l:u,s:null,d:null});save();R()}
function setL(j){const u=prompt("Link (https://… ). Leave blank to remove.",P[pi].i[j].l||"");if(u===null)return;const v=u.trim();if(v&&!ok(v)){alert("Start the link with https://");return}P[pi].i[j].l=v;save();R()}
function delI(j){if(confirm("Delete this lesson?")){P[pi].i.splice(j,1);save();R()}}
function delP(){if(confirm("Delete this whole path?")){P.splice(pi,1);save();V="p";R()}}
function bk(){A.innerHTML=`<button class=back onclick="V='p';R()">← Paths</button><h2>Backup / restore</h2><div class=card><div class=mu>Data lives only on this device. Copy this text somewhere safe.</div><textarea rows=6 readonly onclick="this.select()">${esc(JSON.stringify(P))}</textarea></div><div class=card><b>Restore</b><textarea id=rt rows=4 placeholder="Paste backup text"></textarea><button onclick="rs()">Restore</button><div id=rm></div></div><button class=g onclick="if(confirm('Reset everything to the starting lists?')){P=defaults();save();V='p';R()}">Reset to starting lists</button>`}
function rs(){try{const x=JSON.parse($("rt").value);if(!Array.isArray(x)||!x.every(p=>p.n&&Array.isArray(p.i)))throw 0;P=x;save();V="p";R()}catch(e){$("rm").innerHTML=`<div class=fb>That text isn't a valid backup.</div>`}}

let LIB=null,IMSG="";
const base=u=>String(u||"").split("?")[0].split("#")[0].split("/").pop().toLowerCase();
async function loadLib(){IMSG="Loading…";R();try{const r=await fetch("index.html",{cache:"no-store"});if(!r.ok)throw 0;const dc=new DOMParser().parseFromString(await r.text(),"text/html"),L=[];let sec=null;dc.querySelectorAll("main h2, main a").forEach(e=>{if(e.tagName=="H2"){sec={n:e.textContent.trim(),a:[]};L.push(sec)}else if(sec){const h=e.getAttribute("href"),s=e.querySelector("span"),ds=s?s.textContent.trim():"",t=[...e.childNodes].filter(n=>n.nodeType==3).map(n=>n.textContent).join("").trim();if(h&&t&&ok(h)&&base(h)!="study-dashboard.html")sec.a.push({t,h,d:ds})}});LIB=L.filter(s=>s.a.length);IMSG=""}catch(e){LIB=null;IMSG="Couldn't load the app library. Open this dashboard from the hosted site (not a downloaded file) and check your connection."}R()}
function imp(){const hv=new Set(P.flatMap(p=>p.i.map(x=>base(x.l))).filter(Boolean));let h=`<button class=back onclick="V='p';R()">← Paths</button><h2>App library</h2><div class=mu>Pick apps to add. Each goes into a path named for its section (created if needed). Apps already added are marked. You can still add your own items anytime.</div>`;
if(!LIB){h+=`<div class=card>${IMSG||"Loading…"}</div><button class=g onclick="IMSG='';LIB=null;loadLib()">Try again</button>`;A.innerHTML=h;if(!IMSG)loadLib();return}
LIB.forEach((s,si)=>{h+=`<div class=day>${esc(s.n)}</div>`;s.a.forEach((a,ai)=>{const dn=hv.has(base(a.h));h+=`<label class=card style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type=checkbox id="c${si}_${ai}" ${dn?"disabled":""} style="width:auto;padding:0;margin:4px 0 0"><div><b>${esc(a.t)}</b>${dn?' <span class=mu>· added</span>':""}<div class=mu>${esc(a.d)}</div></div></label>`})});
h+=`<button onclick="doImp()">Import selected</button><button class=g onclick="selAll()">Select all new</button>`;A.innerHTML=h}
function selAll(){document.querySelectorAll("input[type=checkbox]:not(:disabled)").forEach(c=>c.checked=true)}
function doImp(){let n=0;LIB.forEach((s,si)=>{const pick=s.a.filter((a,ai)=>{const c=$("c"+si+"_"+ai);return c&&c.checked&&!c.disabled});if(!pick.length)return;let p=P.find(x=>x.n.toLowerCase()==s.n.toLowerCase());if(!p){p=mk(s.n,[]);P.push(p)}pick.forEach(a=>{p.i.push({t:a.t,l:a.h,s:null,d:null});n++})});if(!n){alert("Nothing selected.");return}save();V="p";R()}
R();
</script></body></html>
