<!DOCTYPE html>
<html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>JSON Arrays Deep Dive</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#6b7385;--pr:#7c3aed;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ef;--code:#eef0f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3046;--code:#262b40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.xp{background:var(--pr);color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.tk{border-left:5px solid var(--pr)}
.day{font-size:12px;font-weight:700;color:var(--pr);text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{width:34px;height:34px;border-radius:50%;background:var(--code);display:grid;place-items:center;font-weight:700;flex:none}
.done .dot{background:var(--ok);color:#fff}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--code);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%;margin-top:10px}
button.g{background:var(--code);color:var(--tx)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);margin-top:8px;font-weight:500}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.opt.no{border-color:var(--bad);background:rgba(220,38,38,.12)}
pre,code{background:var(--code);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
code{padding:1px 5px}pre{padding:10px;overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}td{border-bottom:1px solid var(--bd);padding:6px 4px;vertical-align:top}
.say{margin-top:10px;padding:10px;border-left:4px solid var(--ok);background:var(--code);border-radius:0 10px 10px 0;font-size:15px}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:var(--code);font-size:15px}
.fc{min-height:130px;display:grid;place-items:center;text-align:center;cursor:pointer}
.back{background:none;color:var(--mu);width:auto;padding:4px 0;margin:0}
</style></head><body><div id="app"></div>
<script>
const TITLE="Arrays Deep Dive",SUB="Part 2 of JSON: arrays and nested data, the source of the most mapping bugs. Four lessons on how they work, then four tickets where they break.",KEY="arrDD";
const T=(h,b)=>[`🎫 `+h,b,1];
const L=[
{d:"Foundations",t:"Anatomy of an array",s:[
[`A list in square brackets`,`Two common shapes:<pre>["service","vip","new"]            // simple values\n[{"type":"home"},{"type":"mobile"}] // objects</pre>Arrays of objects are what you'll map most: a list of phones, vehicles, or appointments.`],
[`Index, length, and empty`,`Counting starts at 0: <code>tags[0]</code> is "service". Length is the item count. And <code>[]</code> is a perfectly valid array with zero items. It is <i>not</i> null and not missing, but your mapping may still choke on it.`],
[`Order is not a promise`,`JSON keeps the order it was sent in, but the <b>API</b> decides that order: newest first, alphabetical, or whatever its database returned. It can change after an update.`],
{q:`<code>["service","vip","new"]</code>: what is index 2?`,o:[`"vip"`,`"new"`,`"service"`,`Nothing`],a:1,e:`0 = service, 1 = vip, 2 = new.`},
{q:`How many items are in <code>"phones": []</code>?`,o:[`1`,`0`,`null`,`Invalid JSON`],a:1,e:`It's valid and empty. Plan for it.`},
{q:`<code>[{"type":"home"}]</code> is an array of…`,o:[`Strings`,`Numbers`,`Objects`,`Booleans`],a:2,e:`Curly braces inside the brackets mean objects.`}]},
{d:"Foundations",t:"Position vs attribute",s:[
[`Position is fragile`,`<code>phones[0]</code> means "whatever is first". It breaks when the API reorders the list, adds an item at the front, or the first item is missing. It's the bug from the screenshot: the right number, wrong place.`],
[`Select by attribute`,`Pick the item that <i>means</i> mobile, not the one that's in slot 0. Visual mappers often have a "find where type equals mobile" option. Text-based tools use filter expressions such as:<pre>phones[?(@.type=='mobile')].number</pre>(JSONPath style. Exact syntax varies by tool.)`],
[`Choose a stable identifier`,`Good selectors: <code>type</code>, <code>id</code>, <code>code</code>, a flag like <code>"primary": true</code>. Bad selectors: position, count, or anything that changes with sort order.`],
{q:`Best way to grab the mobile number from a phones array?`,o:[`<code>phones[0]</code>`,`<code>phones[1]</code>`,`Filter where type is "mobile"`,`The last item`],a:2,e:`Attribute-based selection survives reordering.`},
{q:`Which selector is most stable?`,o:[`Index 0`,`The array length`,`A <code>primary: true</code> flag`,`Alphabetical order`],a:2,e:`Meaning beats position.`},
{q:`The API starts adding a new item at the front. What breaks?`,o:[`Filter by type`,`<code>phones[0]</code>`,`Nothing`,`The key names`],a:1,e:`Everything shifts one position.`}]},
{d:"Foundations",t:"Reading deep paths",s:[
[`Walk it left to right`,`Each dot steps into an object. Each <code>[n]</code> steps into an array. Sample:<pre>{"customer":{"name":"Dana",\n "vehicles":[\n  {"vin":"V1","make":"Honda",\n   "services":[\n    {"date":"2026-01-10","type":"oil"},\n    {"date":"2026-06-02","type":"tires"}]},\n  {"vin":"V2","make":"Toyota",\n   "services":[]}\n ]}}</pre>`],
[`Practice reading`,`<code>customer.name</code> → "Dana"<br><code>customer.vehicles[1].make</code> → "Toyota"<br><code>customer.vehicles[0].services[0].type</code> → "oil"<br>Reading paths aloud ("customer, vehicles, first, services, second, date") makes long ones easy.`],
{q:`Path to the tires service date?`,o:[`<code>customer.vehicles[0].services[1].date</code>`,`<code>customer.vehicles[1].services[1].date</code>`,`<code>customer.services[1].date</code>`,`<code>vehicles.services.date</code>`],a:0,e:`First vehicle, second service, date.`},
{q:`What does <code>customer.vehicles[1].services[0].date</code> return?`,o:[`"2026-06-02"`,`Nothing: Toyota's services array is empty`,`"oil"`,`An error in JSON`],a:1,e:`Valid path, but there's no item 0. Your tool may return blank or error.`},
{q:`How many vehicles does this customer have?`,o:[`1`,`2`,`3`,`4`],a:1,e:`The vehicles array holds two objects.`}]},
{d:"Foundations",t:"One-to-many into flat fields",s:[
[`The core problem`,`The source has a list. The destination has a single field (or a different structure). You must choose a strategy:<table><tr><td><b>Pick one</b></td><td>Primary, most recent, or first of a type. Simple, but loses the others.</td></tr><tr><td><b>Join</b></td><td>Combine into one text field ("555-0100; 555-0142"). Keeps everything, hard to search.</td></tr><tr><td><b>Numbered fields</b></td><td>phone1, phone2, phone3. Fixed limit.</td></tr><tr><td><b>Explode</b></td><td>One output record per item, linked by an ID. Most complete.</td></tr></table>`],
[`Get the rule from the business`,`This is a business decision, not a technical one. Ask: which one matters, what happens with the rest, and what if there are none? Write the rule down and have the dealer sign off. It's your UAT habit applied to arrays.`],
{q:`Destination has only a "Primary Phone" field. Best strategy?`,o:[`Explode`,`Pick one (the primary)`,`Join all`,`Skip phones`],a:1,e:`One field, one value: choose by a stable rule.`},
{q:`Each vehicle needs its own record in a Vehicles table. Strategy?`,o:[`Pick one`,`Explode into child records linked by customer ID`,`Join into one text`,`Ignore`],a:1,e:`Explode creates one record per item.`},
{q:`Risk of exploding a customer's vehicles into customer rows?`,o:[`None`,`Duplicate customers unless linked by a unique ID`,`Faster sync`,`Smaller data`],a:1,e:`Without a key, you get one customer row per vehicle.`}]},
{d:"Tickets",t:"Ticket 1: Empty phone list",s:[
T(`Sync stops on certain customers`,`Log:<pre>ERROR record 5521: cannot read 'number' of undefined</pre>Payload for that record:<pre>{"name":"Luis Vega","phones":[]}</pre>Mapping: <code>phones[0].number → phone</code>`),
{q:`Why does it fail?`,o:[`Bad key`,`There is no item 0 in an empty array`,`Auth`,`Rate limit`],a:1,e:`The mapping assumes at least one phone exists.`},
{q:`Best fix?`,o:[`Delete such customers`,`Handle empty: skip the field or set a default, per the dealer's rule`,`Ignore the error`,`Make phones a string`],a:1,e:`Edge cases need an explicit rule, not a crash.`},
{q:`How do you prevent this next time?`,o:[`Hope`,`Test with records that have zero, one, and many items`,`Only test perfect data`,`Reduce logging`],a:1,e:`Test the empties and the extremes.`},
[`Say it in the interview`,`"The mapping assumed every customer has a phone. I added handling for empty arrays and now test zero, one, and many items."`]]},
{d:"Tickets",t:"Ticket 2: Triple customers",s:[
T(`Each customer appears three times`,`Dealer: "Dana Ortiz is in our CRM three times." Source:<pre>{"id":77,"name":"Dana Ortiz",\n "vehicles":[{"vin":"V1"},{"vin":"V2"},{"vin":"V3"}]}</pre>The mapping creates a customer row for every vehicle.`),
{q:`What's the cause?`,o:[`Duplicate API call`,`Exploding vehicles produced one customer row per vehicle`,`Auth`,`Case`],a:1,e:`Three vehicles, so three parent rows.`},
{q:`Best fix?`,o:[`Delete vehicles`,`Create one customer, plus child vehicle records linked by customer ID 77`,`Join everything`,`Pick one vehicle`],a:1,e:`Parent once, children linked by ID.`},
{q:`Cleanup first step?`,o:[`Delete randomly`,`Back up, choose a survivor rule (like lowest ID), merge, then verify counts`,`Ignore`,`Rerun`],a:1,e:`Back up and define the rule before touching data.`},
[`Say it in the interview`,`"Exploding a child array without a parent key duplicated customers. I mapped vehicles as linked child records keyed to the customer ID."`]]},
{d:"Tickets",t:"Ticket 3: Order changed",s:[
T(`Mobile numbers in the Home field, again`,`It worked for months. After the provider's update, the same customer's payload changed:<pre>BEFORE: [mobile, home]\nAFTER:  [home, mobile]</pre>Mapping: <code>phones[0].number → mobile</code>`),
{q:`What changed?`,o:[`Your mapping`,`The API's array order`,`The dealer's data`,`Your key`],a:1,e:`The provider changed ordering. Nothing in your file changed.`},
{q:`Proper fix?`,o:[`Use <code>phones[1]</code> now`,`Select by <code>type</code> (mobile) instead of position`,`Switch to joining`,`Complain`],a:1,e:`Switching to [1] just repeats the bug.`},
{q:`How could you have caught it sooner?`,o:[`Never`,`Monitor for spot-check mismatches and read provider changelogs`,`Turn off logs`,`Retry more`],a:1,e:`Spot checks and release notes catch silent changes.`},
[`Say it in the interview`,`"The provider reordered the array, so a position-based path broke silently. I switched to selecting by type and added a spot-check after provider updates."`]]},
{d:"Tickets",t:"Ticket 4: Object or array?",s:[
T(`Only single-phone customers fail`,`Customers with several phones work. Customers with one fail. Payloads:<pre>MANY: "phones":[{"number":"555-0100"},\n               {"number":"555-0142"}]\nONE:  "phones":{"number":"555-0100"}</pre>Mapping expects an array: <code>phones[0].number</code>`),
{q:`What's going on?`,o:[`Expired token`,`The API returns an object for one item and an array for many`,`Pagination`,`Rate limit`],a:1,e:`A common quirk. The shape changes with the count.`},
{q:`Best fix?`,o:[`Delete single-phone customers`,`Normalize: wrap a lone object in an array before mapping`,`Ask customers to add phones`,`Ignore`],a:1,e:`Normalize to one consistent shape first.`},
{q:`Best long-term step?`,o:[`Nothing`,`Report it to the provider and document the workaround`,`Hide errors`,`Remove arrays`],a:1,e:`Raise it, and write the workaround down.`},
[`Say it in the interview`,`"The shape changed with item count. I normalized single objects into arrays and tested one, many, and zero."`]]},
{d:"Interview",t:"Rapid-fire flashcards",fc:[
[`Array vs object?`,`Array: ordered list in [ ]. Object: key-value pairs in { }.`],
[`First index?`,`0.`],
[`Empty array vs null vs missing?`,`[] means zero items. null means no value. Missing means not sent. Handle all three.`],
[`Why avoid phones[0]?`,`Position breaks when order or count changes. Select by an attribute like type or a primary flag.`],
[`JSONPath filter example?`,`phones[?(@.type=='mobile')].number: items where type is mobile. Syntax varies by tool.`],
[`Four one-to-many strategies?`,`Pick one, join, numbered fields, explode into child records.`],
[`When to explode?`,`When each item needs its own record, linked to the parent by an ID.`],
[`Edge cases to test?`,`Zero items, one item, many items, a single object instead of an array, and reordered lists.`],
[`Question: how would you map multiple phone numbers?`,`Ask the business what the destination needs. Usually pick by type or a primary flag, handle empties, test zero, one, and many.`],
[`Ask them`,`How do your mappings handle lists like multiple phones or vehicles? Do providers announce changes to payloads?`]]}
];
let S={xp:0,done:{}};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app"),nq=l=>l.s.filter(x=>!Array.isArray(x)).length;
function home(){let h=`<div class=top><h1>${TITLE}</h1><span class=xp>⚡ ${S.xp} XP</span></div><div class=mu>${SUB}</div>`;
const n=Object.keys(S.done).length;h+=`<div class=bar><i style="width:${n/L.length*100}%"></i></div><div class=mu>${n} of ${L.length} complete</div>`;
let last="";L.forEach((l,i)=>{if(l.d!=last){h+=`<div class=day>${l.d}</div>`;last=l.d}
h+=`<div class="card les ${S.done[i]!=null?"done":""}" onclick="start(${i})"><div class=dot>${S.done[i]!=null?"✓":i+1}</div><div><b>${l.t}</b><div class=mu>${l.fc?l.fc.length+" flashcards":nq(l)+" questions"}${S.done[i]!=null?" · best "+S.done[i]+"%":""}</div></div></div>`});
h+=`<button class=g onclick="if(confirm('Reset progress?')){S={xp:0,done:{}};save();home()}">Reset progress</button>`;$.innerHTML=h}
let cur,step,score,ans;
function start(i){cur=i;step=0;score=0;ans=false;card()}
function card(){const l=L[cur];if(l.fc)return fc(0);if(step>=l.s.length)return fin();
const c=l.s[step],bar=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${step/l.s.length*100}%"></i></div>`;
if(Array.isArray(c)){const last=step==l.s.length-1;
$.innerHTML=bar+`<div class="card ${c[2]?"tk":""}"><h2>${c[0]}</h2>${last?`<div class=say>${c[1]}</div>`:c[1]}</div><button onclick="step++;card()">${last?"Finish":"Continue"}</button>`;return}
ans=false;$.innerHTML=bar+`<div class=card><div class=mu>Your call</div><h2>${c.q}</h2>${c.o.map((o,k)=>`<button class=opt onclick="pick(${k},this)">${o}</button>`).join("")}<div id=fb></div></div>`}
function pick(k,el){if(ans)return;ans=true;const q=L[cur].s[step];
const ok=k==q.a;if(ok){score++;S.xp+=10}el.classList.add(ok?"ok":"no");
if(!ok)document.querySelectorAll(".opt")[q.a].classList.add("ok");
document.getElementById("fb").innerHTML=`<div class=fb>${ok?"✅ Correct! +10 XP":"❌ Not quite."} ${q.e}</div><button onclick="step++;card()">Next</button>`;save()}
function fin(){const l=L[cur],t=nq(l),p=Math.round(score/t*100);S.done[cur]=Math.max(S.done[cur]||0,p);S.xp+=20;save();
$.innerHTML=`<div class=card style="text-align:center"><h1>${p==100?"🏆":"🎉"} Complete</h1><p>You got ${score}/${t} right (${p}%). +20 XP bonus.</p>${p<100?`<p class=mu>Retry it and explain each answer aloud.</p>`:""}</div><button onclick="start(${cur})" class=g>Retry</button><button onclick="home()">Back to course</button>`}
function fc(i,flip){const l=L[cur],c=l.fc[i];if(i>=l.fc.length){S.done[cur]=100;S.xp+=30;save();return $.innerHTML=`<div class=card style="text-align:center"><h1>🏆 Course finished</h1><p>Open a real payload with a list in it and say aloud how you'd map it, including the zero-item case.</p></div><button onclick="home()">Back to course</button>`}
$.innerHTML=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${i/l.fc.length*100}%"></i></div><div class="card fc" onclick="fc(${i},${!flip})">${flip?`<div>${c[1]}</div>`:`<h2>${c[0]}</h2>`}</div><div class=mu style="text-align:center">${flip?"Did you answer first?":"Answer aloud, then tap to reveal."} Card ${i+1}/${l.fc.length}</div><button onclick="fc(${i+1})">${flip?"Next card":"Skip"}</button>`}
home();
</script></body></html>
