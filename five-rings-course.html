<!DOCTYPE html>
<html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>The Book of Five Rings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f4ef;--card:#fff;--tx:#241d1a;--mu:#7a6f68;--pr:#b3261e;--ok:#16a34a;--bad:#dc2626;--bd:#e6ddd3;--code:#f0e9e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#221c17;--tx:#efe8e0;--mu:#a89c92;--bd:#3a3028;--code:#2e251e}}
:root[data-theme="dark"]{--bg:#17130f;--card:#221c17;--tx:#efe8e0;--mu:#a89c92;--bd:#3a3028;--code:#2e251e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,'Times New Roman',serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.xp{background:var(--pr);color:#fff;border-radius:99px;padding:4px 12px;font:700 14px system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.day{font:700 12px system-ui,sans-serif;color:var(--pr);text-transform:uppercase;letter-spacing:.06em;margin-top:18px}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{width:34px;height:34px;border-radius:50%;background:var(--code);display:grid;place-items:center;font:700 16px system-ui,sans-serif;flex:none}
.done .dot{background:var(--ok);color:#fff}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--code);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
button{font:700 16px system-ui,sans-serif;border:0;border-radius:12px;padding:12px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%;margin-top:10px}
button.g{background:var(--code);color:var(--tx)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);margin-top:8px;font-weight:500}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.opt.no{border-color:var(--bad);background:rgba(220,38,38,.12)}
code{background:var(--code);border-radius:6px;font-size:13px;padding:1px 5px}
.try{margin-top:10px;padding:10px;border-left:4px solid var(--pr);background:var(--code);border-radius:0 10px 10px 0;font-size:15px}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:var(--code);font-size:15px}
.fc{min-height:130px;display:grid;place-items:center;text-align:center;cursor:pointer}
.back{background:none;color:var(--mu);width:auto;padding:4px 0;margin:0}
</style></head><body><div id="app"></div>
<script>
const TITLE="Five Rings",SUB="Miyamoto Musashi's strategy classic, read as a practical philosophy. Every lesson ends with a modern practice to try today. (Everything here is paraphrased, so read a full translation alongside it.)",KEY="ringsC";
const L=[
{d:"Part 1 · The man and the book",t:"Who was Musashi?",s:[
["A swordsman who turned philosopher","Miyamoto Musashi (c. 1584–1645) was a Japanese swordsman who, by his own account, won dozens of duels starting in his teens, and never lost. He later developed a two-sword style, painted, sculpted, and wrote."],
["Why he wrote the book","In his sixties, he settled in a cave near Kumamoto and wrote <i>Go Rin no Sho</i> (<i>The Book of Five Rings</i>) shortly before he died. It's a distilled lifetime of lessons, written as a practical guide, not poetry."],
["The structure","Five scrolls named for the elements: <b>Earth</b> (foundations), <b>Water</b> (mind and technique), <b>Fire</b> (decisive action), <b>Wind</b> (other schools), <b>Void</b> (clarity beyond fixed forms). Notice the arc: from basics to freedom."],
["Strategy isn't just fighting","Musashi's \"strategy\" (<i>heihō</i>) means winning in any craft: a carpenter, a merchant, a leader. He constantly compares swordsmanship to other trades. That's why it still applies to work and life."]],
q:[{q:"What are the five scrolls?",o:["Earth, Water, Fire, Wind, Void","Sword, Shield, Bow, Horse, Spear","Mind, Body, Spirit, Breath, Will","Past, Present, Future, Self, Other"],a:0,e:"Each ring is an element and a stage of mastery."},
{q:"When did he write the book?",o:["As a teenager","Late in life, shortly before he died","After retiring from painting","He didn't write it"],a:1,e:"It's the summary of a lifetime."},
{q:"'Strategy' in the book means…",o:["Only sword fighting","Winning in any craft or field","Only military planning","Gambling"],a:1,e:"He applies it to all trades and leadership."}]},
{d:"Part 2 · The five rings",t:"Earth: foundations",s:[
["Know the whole picture","The Earth scroll lays the groundwork. Musashi compares a strategist to a master carpenter: someone who understands materials, plans, people, and timing, not only one tool."],
["Principles in his own spirit (paraphrased)","Think honestly. Train continually. Study many arts, not just yours. Understand how other trades work. Judge real gain and loss. Develop your intuition for what matters. Notice what isn't obvious. Pay attention to small things. Do nothing useless."],
["Rhythm and timing","Everything has rhythm: when to move, when to wait, when things rise and fall. Knowing the rhythm of your work, your team, and your own energy is half of skill."],
["Modern application","<b>Do nothing useless</b> is a powerful filter. Ask of any task today: does this serve my goal? Learn the adjacent craft too. A data person who understands the business wins more than one who only knows the tool."]],
q:[{q:"The carpenter comparison teaches…",o:["Build things by hand","A strategist understands the whole craft, not one tool","Work slowly","Avoid teams"],a:1,e:"Breadth of understanding is part of mastery."},
{q:"'Do nothing useless' today means…",o:["Never relax","Filter tasks by whether they serve the goal","Work faster","Skip planning"],a:1,e:"It's a principle of ruthless focus."},
{q:"Why study many arts?",o:["Boasting","Cross-learning sharpens judgment","He hated specialists","Fashion"],a:1,e:"Broad understanding feeds intuition."}],
try:"Today: cross out one task on your list that doesn't serve your real goal."},
{d:"Part 2 · The five rings",t:"Water: mind and technique",s:[
["Water adapts","Water takes the shape of its container and can be a drop or an ocean. Musashi wants a mind that is calm, flexible, and unfixed, in motion and at rest alike."],
["Normal mind","He advises keeping the same calm state in training and in real conflict, and not letting emotion shift it. In daily life: the same steady self in an interview, an argument, or a quiet Tuesday."],
["Perceive, don't just look","He distinguishes seeing with the eyes from perceiving the deeper situation: intent, momentum, what's about to happen. Pay strong attention to what's underneath and weaker attention to surface flash."],
["A thousand days, ten thousand days","He says a thousand days of training forges you, and ten thousand polishes you. Mastery is repetition over years. Don't judge a skill after a week."],
["Modern application","Skill beats motivation. Show up daily, in a steady mood, and let repetition do the work. When stressed, return to your breath and posture first."]],
q:[{q:"'Normal mind' means…",o:["Average ability","Staying calm and steady in all situations","Suppressing all feeling forever","Ignoring others"],a:1,e:"Equanimity in training and in crisis alike."},
{q:"Perceiving vs looking means…",o:["Staring harder","Reading intent and the deeper situation","Closing your eyes","Using a mirror"],a:1,e:"Look beyond surface flash."},
{q:"The 1,000 / 10,000 days idea says…",o:["Rest a lot","Mastery takes long repetition","Talent is everything","Quit fast"],a:1,e:"Forge, then polish. Patience is the method."}],
try:"Today: do 20 focused minutes on a skill you want, no matter your mood."},
{d:"Part 2 · The five rings",t:"Fire: decisive action",s:[
["Fire is energy and timing","Fire grows or shrinks quickly, which is why Musashi uses it for combat, and by extension any high-stakes moment. The scroll is about taking the initiative and choosing the moment."],
["Initiative","Don't wait to be driven by events. He describes striking first, countering, or meeting an attack simultaneously, with an emphasis on seizing control of the rhythm rather than reacting."],
["Know the place and the conditions","Pay attention to surroundings: light, ground, position. In modern life that's your environment: the meeting room, the inbox, your own energy levels. Arrange conditions in your favor."],
["Commit","He distrusts hesitation. Once you've judged well, act fully. Half-hearted action wastes the chance."],
["Modern application","Start the hard thing first. Send the email. Book the interview. Decide, then commit, then adjust."]],
q:[{q:"Why fire?",o:["It's calm","It changes fast, like high-stakes action","It's pure","It's slow"],a:1,e:"Fire is energy and rapid change."},
{q:"Taking the initiative means…",o:["Waiting","Controlling the rhythm rather than just reacting","Being loud","Avoiding risks"],a:1,e:"Set the pace when you can."},
{q:"A modern fire practice is…",o:["Procrastinate","Do the hard thing first and commit","Scroll","Plan forever"],a:1,e:"Decide, commit, adjust."}],
try:"Today: do your most dreaded task in the first hour."},
{d:"Part 2 · The five rings",t:"Wind: other ways",s:[
["Know other schools","The Wind scroll surveys other fencing schools of his day. His critique is practical: some rely on flashy technique, some on one favorite weapon, some on rigid secret forms."],
["Beware of attachment","A style or tool you love can trap you. He warns against fixation on any single weapon, stance, or trick. The goal is the result, not the method's elegance."],
["Know yourself by knowing others","Studying other approaches reveals your own blind spots. You can't judge your way until you understand alternatives."],
["Modern application","If you love SQL, learn Python. If you love your routine, test a different one for a week. Ask: am I attached to a method, or to what it achieves?"]],
q:[{q:"Wind's core warning is against…",o:["Fast action","Fixation on one style or tool","Studying others","Practice"],a:1,e:"Rigid attachment limits you."},
{q:"Studying other approaches helps you…",o:["Copy them","See your own blind spots","Win arguments","Avoid choices"],a:1,e:"Contrast reveals bias."},
{q:"The goal is…",o:["Elegant method","The result","Tradition","Novelty"],a:1,e:"Method serves outcome."}],
try:"Today: try one different way of doing a routine task."},
{d:"Part 2 · The five rings",t:"Void: clarity",s:[
["The unnamed ring","The Void scroll is the shortest. It's about a mind free of confusion, doubt, and clutter, open and clear, with no fixed attachment, and then acting from that clarity."],
["Not nothing","Void doesn't mean empty or blank. It means wide open: no distortion from ego, fear, or assumptions, so you see what's really there."],
["The paradox","After years of detailed training, mastery looks effortless and unforced. You've practiced so deeply that the right action just arises."],
["Modern application","Clear the clutter before a decision: a walk, five slow breaths, writing the problem down. Then act. Clarity isn't mystical, it's a state you can build."]],
q:[{q:"Void means…",o:["Empty and numb","An open, clear mind free of distortion","Giving up","A weapon"],a:1,e:"Wide-open, undistorted perception."},
{q:"Void follows…",o:["Laziness","Deep practice","Luck","Silence only"],a:1,e:"Effortlessness comes after discipline."},
{q:"A practical void habit?",o:["Doomscrolling","Pause, breathe, write the problem down","Multitask","Decide instantly"],a:1,e:"Clear the clutter, then act."}],
try:"Today: take five slow breaths before your next big decision."},
{d:"Part 3 · Living it",t:"The Dokkōdō",s:[
["The Way of Walking Alone","Days before he died, Musashi wrote <i>Dokkōdō</i>, 21 short precepts for living. It's his personal code."],
["Themes (paraphrased)","Accept things as they are. Don't depend on others' approval. Don't regret what you've done. Don't envy. Don't chase luxury or comfort. Let go of obsession with possessions. Respect the sacred but don't rely on it. Stay devoted to your path."],
["Interpretation","These are not about isolation; they are about self-reliance and inner steadiness. Your peace shouldn't hinge on praise, comfort, or outcomes you can't control, which echoes Stoicism."],
["Modern application","Choose one precept as your weekly theme, like 'don't depend on approval'. Notice when you're violating it. That's practice."]],
q:[{q:"The Dokkōdō is…",o:["A sword form","21 precepts for living","A map","A poem about nature"],a:1,e:"His personal code."},
{q:"A major theme is…",o:["Seeking approval","Inner steadiness and self-reliance","Luxury","Avoiding all people"],a:1,e:"Independence of mind."},
{q:"A good use of it today?",o:["Memorize all 21","Pick one precept as a weekly theme","Ignore it","Quote it online"],a:1,e:"One precept, practiced, beats 21 memorized."}],
try:"This week: pick one precept and write one line each night on how it went."},
{d:"Part 3 · Living it",t:"Flashcards & daily practice",fc:[
["What are the five rings?","Earth (foundations), Water (mind and technique), Fire (decisive action), Wind (other ways and bias), Void (clear, open mind)."],
["Earth principle you'll use","Do nothing useless. Filter every task by whether it serves the goal."],
["Water principle you'll use","Normal mind: stay steady. Show up daily; repetition forges skill."],
["Fire principle you'll use","Take the initiative: choose the moment, commit, and adjust."],
["Wind principle you'll use","Don't get attached to one tool or style. Study alternatives."],
["Void principle you'll use","Clear the clutter, then act from clarity."],
["Why 1,000 and 10,000 days?","Training forges you first and polishes you later; mastery takes years."],
["What is the Dokkōdō?","21 precepts for self-reliant, steady living, written near the end of his life."],
["Your morning ritual (Earth + Water)","Set one thing that serves the goal; do 20 focused minutes on your craft first."],
["Your evening review (Void)","Three breaths, one line: what did I do well, what was useless, what's tomorrow's one thing?"]]}
];
let S={xp:0,done:{}};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
function home(){let h=`<div class=top><h1>${TITLE}</h1><span class=xp>⚡ ${S.xp} XP</span></div><div class=mu>${SUB}</div>`;
const n=Object.keys(S.done).length;h+=`<div class=bar><i style="width:${n/L.length*100}%"></i></div><div class=mu>${n} of ${L.length} lessons complete</div>`;
let last="";L.forEach((l,i)=>{if(l.d!=last){h+=`<div class=day>${l.d}</div>`;last=l.d}
h+=`<div class="card les ${S.done[i]!=null?"done":""}" onclick="start(${i})"><div class=dot>${S.done[i]!=null?"✓":i+1}</div><div><b>${l.t}</b><div class=mu>${l.fc?l.fc.length+" flashcards":l.s.length+" cards · "+l.q.length+" questions"}${S.done[i]!=null?" · best "+S.done[i]+"%":""}</div></div></div>`});
h+=`<button class=g onclick="if(confirm('Reset progress?')){S={xp:0,done:{}};save();home()}">Reset progress</button>`;$.innerHTML=h}
let cur,step,score,ans;
function start(i){cur=i;step=0;score=0;ans=false;card()}
function card(){const l=L[cur];if(l.fc)return fc(0);
if(step<l.s.length){const c=l.s[step];$.innerHTML=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${step/(l.s.length+l.q.length)*100}%"></i></div><div class=card><h2>${c[0]}</h2>${c[1]}</div><button onclick="step++;card()">Continue</button>`;return}
const qi=step-l.s.length;if(qi>=l.q.length)return fin();
const q=l.q[qi];ans=false;
$.innerHTML=`<button class=back onclick="home()">← Quit</button><div class=bar><i style="width:${step/(l.s.length+l.q.length)*100}%"></i></div><div class=card><div class=mu>Question ${qi+1} of ${l.q.length}</div><h2>${q.q}</h2>${q.o.map((o,k)=>`<button class=opt onclick="pick(${k},this)">${o}</button>`).join("")}<div id=fb></div></div>`}
function pick(k,el){if(ans)return;ans=true;const q=L[cur].q[step-L[cur].s.length];
const ok=k==q.a;if(ok){score++;S.xp+=10}el.classList.add(ok?"ok":"no");
if(!ok)document.querySelectorAll(".opt")[q.a].classList.add("ok");
document.getElementById("fb").innerHTML=`<div class=fb>${ok?"✅ Correct! +10 XP":"❌ Not quite."} ${q.e}</div><button onclick="step++;card()">Next</button>`;save()}
function fin(){const l=L[cur],p=Math.round(score/l.q.length*100);S.done[cur]=Math.max(S.done[cur]||0,p);S.xp+=20;save();
$.innerHTML=`<div class=card style="text-align:center"><h1>${p==100?"🏆":"🎉"} Lesson complete</h1><p>You scored ${score}/${l.q.length} (${p}%). +20 XP bonus.</p>${l.try?`<div class=try style="text-align:left"><b>Practice.</b> ${l.try}</div>`:""}</div><button onclick="start(${cur})" class=g>Retry</button><button onclick="home()">Back to course</button>`}
function fc(i,flip){const l=L[cur],c=l.fc[i];if(i>=l.fc.length){S.done[cur]=100;S.xp+=30;save();return $.innerHTML=`<div class=card style="text-align:center"><h1>🏆 Course finished</h1><p>Pick one practice from the Earth, Water, Fire, Wind, or Void lessons and run it for a week.</p></div><button onclick="home()">Back to course</button>`}
$.innerHTML=`<button class=back onclick="home()">← Back</button><div class=bar><i style="width:${i/l.fc.length*100}%"></i></div><div class="card fc" onclick="fc(${i},${!flip})">${flip?`<div>${c[1]}</div>`:`<h2>${c[0]}</h2>`}</div><div class=mu style="text-align:center">${flip?"Did you recall it first?":"Answer in your head, then tap to reveal."} Card ${i+1}/${l.fc.length}</div><button onclick="fc(${i+1})">${flip?"Next card":"Skip"}</button>`}
home();
</script></body></html>
